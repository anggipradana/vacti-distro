# Publish vacti-distro images to Hugging Face Datasets.
#
# WHY: GitHub Releases cap each asset at 2GiB, which blocks the OVA / ISO /
# qcow2 images. Hugging Face Datasets allow up to 50GiB per LFS file, free,
# with stable public resolve URLs. This workflow is the permanent home for the
# large images. It runs AFTER a successful image build and uploads the large
# forms to the dataset anggipradana/vacti-distro-images.
#
# TRIGGERS (P0-2): it is a REUSABLE workflow. build.yml / build-arm64.yml call it
# inline (`uses: ./.github/workflows/publish-images-hf.yml`) as their last job, after
# the OVA publish succeeded, with run_id = their own run. It used to listen on
# `workflow_run`, but GitHub never emits workflow_run for a run started by
# GITHUB_TOKEN, and watch-engine-apt dispatches every build with GITHUB_TOKEN, so
# no automatic publish fired after 0.2.449 (2026-11-11). workflow_dispatch stays for a
# manual (re-)publish of a known-good run:
#   gh workflow run publish-images-hf.yml -f run_id=<id> -f version=<X.Y.Z> -f arch=<amd64|arm64|both>
#
# DIVISION OF LABOUR (the ">2GiB skip"): build-images / build-images-arm64
# still attach the SMALL assets (.deb, fingerprint JSON, MANIFEST.sha256 - all
# well under 2GiB) to the PRIVATE GitHub Release, which stays their canonical
# home next to the apt repo. The large OVA/ISO/qcow2 images (> 2GiB) are NOT
# attached to the Release - they are routed here to HF instead.
#
# SECRET REQUIRED: this workflow reads HF_PUBLISH_TOKEN from the repo secrets.
# The operator must add it (the hf_... write token used for the dataset).
name: publish-images-hf

on:
  workflow_call:
    inputs:
      run_id:
        description: "build-images / build-images-arm64 run id to publish (the caller's github.run_id)"
        type: string
        required: true
      version:
        description: "Release version X.Y.Z, or 'auto' to derive from artifact filenames"
        type: string
        required: false
        default: "auto"
      arch:
        description: "Which arch set the run produced (amd64 | arm64 | both)"
        type: string
        required: false
        default: "both"
    secrets:
      HF_PUBLISH_TOKEN:
        required: false
  workflow_dispatch:
    inputs:
      run_id:
        description: "build-images / build-images-arm64 run id to publish"
        required: true
      version:
        description: "Release version X.Y.Z, or 'auto' to derive from artifact filenames"
        required: false
        default: "auto"
      arch:
        description: "Which arch set the run produced"
        required: false
        type: choice
        default: "both"
        options:
          - "both"
          - "amd64"
          - "arm64"

# Least privilege: read the triggering run's artifacts, nothing else. The HF
# upload authenticates with HF_PUBLISH_TOKEN, not the GitHub token.
permissions:
  actions: read
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Serialize publishes of the SAME version (amd64 + arm64 both rewrite the README
    # index and merge SHA256SUMS). Keyed on `inputs.*`, which is populated for both
    # workflow_call and workflow_dispatch (the event-payload inputs are the CALLER's
    # under workflow_call, so they must not be used here). "Never publish from a red
    # build" is structural now: the callers' publish-hf job needs their publish job.
    concurrency:
      group: publish-images-hf-${{ inputs.version != 'auto' && inputs.version || inputs.run_id }}
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0   # full history so the forbidden-pattern guard can scan the commit range

      # Pre-publish naming/secret guard (Option-B inline): scans the release-note
      # corpus (commit-range + arsenal manifest + any release body) before the HF
      # push. The HF dataset card is a release-note surface too. Serves
      # naming-discipline + client-scrub.
      - name: Forbidden-pattern guard (pre-publish)
        env:
          FORBIDDEN_MANIFEST: distro/packages/arsenal-manifest.json
        run: |
          set -euo pipefail
          chmod +x .ci/check-forbidden.sh
          .ci/check-forbidden.sh

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install huggingface_hub CLI (minor-pinned)
        run: pip install "huggingface_hub[cli]~=0.35.0"

      - name: Resolve run id, version, and arch
        id: resolve
        env:
          # `inputs` is filled for both workflow_call (from the caller's `with:`) and
          # workflow_dispatch.
          IN_RUN_ID: ${{ inputs.run_id }}
          IN_VERSION: ${{ inputs.version }}
          IN_ARCH: ${{ inputs.arch }}
        run: |
          set -euo pipefail

          RUN_ID="${IN_RUN_ID:-}"
          echo "$RUN_ID" | grep -Eq '^[0-9]+$' || { echo "run_id must be a numeric run id (got '${RUN_ID}')"; exit 1; }

          ARCH="${IN_ARCH:-both}"
          case "$ARCH" in amd64|arm64|both) ;; *) echo "arch must be amd64|arm64|both (got '${ARCH}')"; exit 1 ;; esac

          # Version: an explicit X.Y.Z, else 'auto' (the script derives it from the
          # artifact filenames). A leading v is tolerated.
          VERSION="${IN_VERSION:-auto}"
          VERSION="${VERSION#v}"
          if [ "$VERSION" != "auto" ] && ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "version must be X.Y.Z or auto (got '${VERSION}')"; exit 1
          fi

          echo "run_id=$RUN_ID"   >> "$GITHUB_OUTPUT"
          echo "arch=$ARCH"       >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "[resolve] run_id=$RUN_ID arch=$ARCH version=$VERSION"

      - name: Detect image artifacts on the run
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ steps.resolve.outputs.run_id }}
        run: |
          set -euo pipefail
          # Called inline the artifacts were uploaded by earlier jobs of the SAME
          # (still in-progress) run; upload-artifact@v4 artifacts are listable and
          # downloadable as soon as each upload finishes. A run with no form-*
          # artifacts (nothing to publish) is skipped cleanly.
          names="$(gh api --paginate \
            "repos/${{ github.repository }}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[].name' 2>/dev/null || true)"
          echo "[detect] artifacts:"; echo "${names:-<none>}"
          if echo "$names" | grep -Eq '^form-'; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "[detect] no form-* image artifacts; nothing to publish to HF"
          fi

      - name: Publish images to Hugging Face
        if: steps.detect.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          HF_TOKEN: ${{ secrets.HF_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${HF_TOKEN:-}" ]; then
            echo "HF_PUBLISH_TOKEN secret is not set on this repo; cannot publish." >&2
            echo "Add it in Settings > Secrets and variables > Actions (the hf_... write token)." >&2
            exit 1
          fi
          chmod +x scripts/publish-images-to-hf.sh
          scripts/publish-images-to-hf.sh \
            --run-id "${{ steps.resolve.outputs.run_id }}" \
            --version "${{ steps.resolve.outputs.version }}" \
            --arch "${{ steps.resolve.outputs.arch }}"
