# Secret-leak prevention gate.
#   pull_request      -> BLOCKS the PR if a secret is detected (exit non-zero).
#   push to main      -> ALERTS only (does not block; the push already happened),
#                        findings still land in the Security tab / step annotations.
#   workflow_dispatch -> on-demand full scan.
# All third-party actions are pinned to a 40-hex commit SHA, never a mutable tag.
name: secret-scan

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  security-events: write # required by github/codeql-action/upload-sarif ONLY

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  scan:
    name: gitleaks + trufflehog
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout (full history)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install gitleaks (pinned release)
        run: |
          set -euo pipefail
          VERSION=8.30.1
          curl -sSL -o /tmp/gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          tar -xzf /tmp/gitleaks.tar.gz -C /tmp gitleaks
          sudo install -m 0755 /tmp/gitleaks /usr/local/bin/gitleaks
          gitleaks version

      - name: Gitleaks scan (full git history)
        id: gitleaks
        # On push we alert but do not fail the job (the commit is already public).
        # On pull_request / workflow_dispatch a finding fails the step and blocks.
        continue-on-error: ${{ github.event_name == 'push' }}
        run: |
          set -o pipefail
          gitleaks detect \
            --source . \
            --config .gitleaks.toml \
            --redact \
            --exit-code 1 \
            --report-format sarif \
            --report-path gitleaks.sarif \
            --no-banner

      - name: Upload gitleaks SARIF to Security tab
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@915412ff23e8b7659517e607487dbeae018f2934 # v4.39.5
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

      - name: TruffleHog scan (verified + unknown)
        # The action derives base/head from the event itself:
        #   pull_request -> base.sha..head.sha | push -> before..after | dispatch -> full.
        # It passes --fail internally; continue-on-error keeps push non-blocking.
        continue-on-error: ${{ github.event_name == 'push' }}
        uses: trufflesecurity/trufflehog@4ef51f69ca6347aaa76a5e64a87eac9c0c909f71 # v3.100.1
        with:
          version: "3.100.0"
          extra_args: --results=verified,unknown
