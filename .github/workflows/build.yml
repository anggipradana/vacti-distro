# vacti-distro image build matrix.
#
# This is where the HEAVY build runs: GitHub Actions (OFF-PROD), never on the
# vacti control plane. It builds the golden disk once, fans it out to every
# VM/cloud form, builds the ISO, runs the MANDATORY no-secret scan on every
# emitted artifact, smoke-boots each, and publishes them as PRIVATE GitHub
# Release assets on this (private) repo.
#
# Triggered manually, or by a repository_dispatch from the engine release-deb
# pipeline after a new vacti-engine .deb is published.
name: build-images

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release version to stamp (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      full_arsenal:
        description: "Bake the full arsenal (1) or lean web+infra (0)"
        required: false
        default: "0"
      forms:
        description: "Which image forms to build"
        required: false
        type: choice
        default: "golden+cloud"
        options:
          - "golden+cloud"   # cheap first run: lint -> golden -> cloud -> smoke -> publish
          - "all"            # full matrix: golden + cloud/vmware-ova/vbox-ova + iso(headless,gui)
  repository_dispatch:
    types: [engine-deb-published]
  # Tag push: builds ONLY the universal Docker image (the docker-publish-ghcr job
  # gates itself on this event). The heavy VM/ISO matrix skips on a bare tag push
  # via the event guard on the lint job, which the rest of the matrix depends on.
  push:
    tags:
      - "images-v*"
      - "engine-v*"
      - "v*"

permissions:
  contents: write   # create/attach PRIVATE release assets on this private repo

env:
  VACTI_RELEASE: ${{ github.event.inputs.release || github.event.client_payload.release || '0.1.0' }}
  VACTI_FULL_ARSENAL: ${{ github.event.inputs.full_arsenal || '0' }}
  # Pinned engine ref the image builds against + the arsenal manifest the sync
  # guard checks. Empty = floating latest (historical behavior). The engine-deb-
  # published dispatch feeds the just-published version in via client_payload.release.
  VACTI_ENGINE_REF: ${{ vars.VACTI_ENGINE_REF || github.event.client_payload.release || '' }}
  # Form scoping. workflow_dispatch defaults to the cheap golden+cloud path; a
  # repository_dispatch (engine-deb-published) has no input, so it falls back to
  # 'all' - the full matrix, exactly as before. NOTE: the `env` context is not
  # available in a job's `strategy.matrix`, so the fan-out matrix and the iso
  # job gate evaluate `github.event.inputs.forms` directly (same default).
  VACTI_FORMS: ${{ github.event.inputs.forms || 'all' }}
  VACTI_APT_URL: ${{ vars.VACTI_APT_URL }}
  # Build-time private-repo credential. A build-time secret, NEVER baked into an
  # image (the build strips it before finalize; the no-secret scan re-verifies).
  VACTI_APT_PRODUCER_TOKEN: ${{ secrets.VACTI_APT_PRODUCER_TOKEN }}
  OUT_DIR: out

jobs:
  # --- light gate: shellcheck + yaml/xml sanity (fast, no image build) --------
  lint:
    # A bare tag push builds only the Docker image; skip the whole VM/ISO matrix
    # (golden, fanout, iso, smoke, publish all chain off this job) on that event.
    if: ${{ github.event_name != 'push' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml libxml2-utils
      # AUTO-REVENDOR (auto-triggered rebuilds only). An engine-deb-published
      # dispatch pins VACTI_ENGINE_REF to the just-published release; the engine
      # arsenal set may legitimately have drifted from the committed snapshot, which
      # would red-lint arsenal-sync-check below. Re-vendor the snapshot IN-WORKSPACE
      # from the engine's authoritative manifest for that ref (same resolver the lint
      # guard uses) FIRST, so the auto-rebuild stays green. A normal manual
      # workflow_dispatch does NOT match this guard, so it keeps the COMMITTED
      # snapshot and arsenal-sync-check's drift detection stays live. Soft if no
      # reference is reachable (apt creds absent) - the committed snapshot is kept.
      - name: Auto-revendor arsenal manifest (engine-deb-published only)
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: ci/revendor-arsenal.sh
      - name: Lint build sources
        run: ci/lint.sh

  # --- the golden disk: built ONCE, shared by all VM/cloud forms --------------
  golden:
    needs: lint
    runs-on: ubuntu-latest
    steps:
      # Hosted Ubuntu runners ship ~14GB free; the golden qcow2 (~2GB raw, grown
      # to give the appliance room) plus the downloaded Debian base image exhaust
      # it. Reclaim >30GB by dropping pre-installed toolchains this build never
      # uses. Runs FIRST, before any checkout or build.
      - name: Free disk space (reclaim >30GB on the runner)
        run: |
          echo "[disk] before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "[disk] after:"; df -h /
      - uses: actions/checkout@v4
      - name: Install libguestfs + qemu toolchain (+ runner workarounds)
        uses: ./.github/actions/libguestfs-runner
        with:
          extra-packages: genisoimage xorriso
      - name: Build golden disk (virt-customize, off-prod)
        run: |
          export LIBGUESTFS_BACKEND=direct
          # TEMP: full libguestfs trace so the exact passt invocation (guest
          # address/gateway/DNS scheme) is logged; reverted once green.
          export LIBGUESTFS_DEBUG=1 LIBGUESTFS_TRACE=1
          make golden
      - name: No-secret scan (golden)
        run: ci/no-secret-scan.sh out/vacti-engine-${VACTI_RELEASE}-golden.qcow2
      - name: Reclaim intermediate build files before upload
        # Only out/vacti-engine-<ver>-golden.qcow2 is needed downstream. The
        # downloaded Debian base image + virt-customize work tree under
        # distro/.build are no longer required and would otherwise be snapshotted
        # by later steps; drop them to leave headroom for the upload.
        run: |
          echo "[disk] before cleanup:"; df -h /
          rm -rf distro/.build || true
          echo "[disk] after cleanup:"; df -h /
      - name: Upload golden as a build artifact (passed to fan-out jobs)
        uses: actions/upload-artifact@v4
        with:
          name: golden-qcow2
          path: |
            out/vacti-engine-${{ env.VACTI_RELEASE }}-golden.qcow2
          retention-days: 2
          if-no-files-found: error

  # --- fan-out: each VM/cloud form is a repackaging of the SAME golden disk ----
  fanout:
    needs: golden
    runs-on: ubuntu-latest
    # The no-secret scan below guestmounts the converted qcow2, so this job needs
    # the SAME libguestfs runner environment as golden: the direct backend plus
    # the kernel/KVM/passt-AppArmor/userns workarounds in the composite action.
    env:
      LIBGUESTFS_BACKEND: direct
    strategy:
      fail-fast: false
      matrix:
        # forms=all -> cloud + both OVA forms; forms=golden+cloud -> cloud only
        # (OVA conversions skipped). env is unavailable here, so read the input.
        form: ${{ fromJSON((github.event.inputs.forms || 'all') == 'all' && '["cloud","vmware-ova","vbox-ova"]' || '["cloud"]') }}
    steps:
      # Same squeeze as golden: the fetched golden qcow2 (~2GB) plus the
      # converted form (raw.gz / streamOptimized VMDK / .ova) blow past the
      # runner's ~14GB free. Reclaim >30GB first, before checkout or download.
      - name: Free disk space (reclaim >30GB on the runner)
        run: |
          echo "[disk] before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "[disk] after:"; df -h /
      - uses: actions/checkout@v4
      - name: Install toolchain (+ runner workarounds)
        uses: ./.github/actions/libguestfs-runner
        with:
          # fuse3 for guestmount; libxml2-utils (xmllint) for the OVF gate.
          extra-packages: fuse3 libxml2-utils
      - name: Fetch the golden disk
        uses: actions/download-artifact@v4
        with:
          name: golden-qcow2
          path: out
      - name: Convert -> ${{ matrix.form }}
        run: make ${{ matrix.form }}
      - name: Validate OVF/OVA structure (member order, schema, sizes, hashes, RAM floor)
        # FOSS, offline structural gate for the hand-authored OVFs. No-op for the
        # cloud form (it emits no .ova). Catches the mechanical spec errors that a
        # bare tar + .mf cannot; the real-import check is the dev-box ovftool lane.
        run: |
          shopt -s nullglob
          ovas=(out/*.ova)
          if [[ ${#ovas[@]} -gt 0 ]]; then
            ci/validate-ovf.sh "${ovas[@]}"
          else
            echo "[validate-ovf] no .ova in this form (${{ matrix.form }}); skipping"
          fi
      - name: Reclaim golden disk after conversion
        # The golden qcow2 (~2GB) is only the conversion SOURCE - it is neither
        # scanned (the scan skips *golden*) nor uploaded by this job. Drop it now
        # so the mandatory scan (which gzip-decompresses raw.gz / qemu-img
        # converts the OVA's VMDK to a temp raw) and the upload have headroom.
        run: |
          echo "[disk] before cleanup:"; df -h /
          rm -f out/*golden*.qcow2 || true
          echo "[disk] after cleanup:"; df -h /
      - name: No-secret scan (${{ matrix.form }})  # MANDATORY, non-negotiable
        # no-secret-scan.sh guestmounts each artifact read-only and unmounts +
        # removes its temp mountpoints via a trap on EXIT, so nothing stays
        # mounted or staged before the upload step.
        run: |
          shopt -s nullglob
          for a in out/*.qcow2 out/*.raw.gz out/*.ova; do
            case "$a" in *golden*) continue;; esac
            ci/no-secret-scan.sh "$a"
          done
      - name: Upload ${{ matrix.form }} artifacts
        uses: actions/upload-artifact@v4
        with:
          name: form-${{ matrix.form }}
          path: |
            out/*.qcow2
            out/*.raw.gz
            out/*.ova
            out/*.sha256
          retention-days: 2

  # --- the installable ISO: live-build in a privileged debian:trixie container -
  iso:
    needs: lint
    # ISO (live-build, both SKUs) only on the full-matrix path; skipped for the
    # cheap golden+cloud first run.
    if: ${{ (github.event.inputs.forms || 'all') == 'all' }}
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged   # loop devices + mount for live-build/squashfs
      # This container's overlay, the workspace and /tmp all live on the HOST's
      # root disk (/dev/root, ~14GB free; on these runners /mnt is that same
      # disk, not a spare volume). Bind the host toolchain trees in so the first
      # step can reclaim that disk from inside the container.
      volumes:
        - /usr:/host/usr
        - /opt:/host/opt
    strategy:
      fail-fast: false
      matrix:
        sku: [headless, gui]
    steps:
      # Same squeeze as golden/fanout, done from INSIDE the container: live-build
      # copies its ~8-9GB chroot (installer + binary stages) and adds the squashfs,
      # .deb cache and ISO, which exhausted ~14GB free. The host /usr and /opt
      # are bound in above, so deleting the same toolchains golden drops frees the
      # very disk this container writes to (14GB -> ~44GB+). live-build itself
      # keeps REAL work dirs in place: it moves/copies chroot/ and binary/ into the
      # chroot and runs mksquashfs/xorriso there, so they must not be symlinks.
      # Runs FIRST, before any checkout or build.
      - name: Free disk space (reclaim >30GB of the host disk from the container)
        run: |
          echo "[disk] before:"; df -h /
          rm -rf \
            /host/usr/local/lib/android \
            /host/usr/share/dotnet \
            /host/opt/ghc /host/usr/local/.ghcup \
            /host/opt/hostedtoolcache \
            /host/usr/local/share/boost \
            /host/usr/share/swift \
            /host/usr/lib/jvm \
            /host/usr/local/share/powershell \
            /host/usr/lib/google-cloud-sdk || true
          echo "[disk] after:"; df -h /
      - uses: actions/checkout@v4
      - name: Install live-build toolchain
        run: |
          apt-get update
          # jq: gen-live-build-list.sh parses the engine arsenal manifest with it
          # (the debian:trixie container has neither jq nor python3 by default).
          # python3: the auto-revendor resolver (ci/arsenal-sync-check.sh) parses the
          # apt Packages index + manifests with it. dpkg-deb + tar + gzip are already
          # in the base image (dpkg is Essential).
          apt-get install -y live-build xorriso squashfs-tools ca-certificates curl gnupg make jq python3
      # AUTO-REVENDOR (auto-triggered rebuilds only). The ISO derives its baked
      # arsenal package list HOST-SIDE from the vendored snapshot (build-iso.sh ->
      # gen-live-build-list.sh; no engine .deb is installed in this container to read
      # the manifest from, unlike the golden path). So on an engine-deb-published
      # rebuild the snapshot must be refreshed to the pinned ref BEFORE `make iso`,
      # or the ISO bakes a stale list. Same resolver/guard as the lint job; a manual
      # build keeps the committed snapshot.
      - name: Auto-revendor arsenal manifest (engine-deb-published only)
        if: ${{ github.event_name == 'repository_dispatch' }}
        shell: bash
        run: ci/revendor-arsenal.sh
      - name: Build ISO (${{ matrix.sku }}, off-prod)
        run: VACTI_ISO_SKU=${{ matrix.sku }} make $([ "${{ matrix.sku }}" = gui ] && echo iso-gui || echo iso)
      - name: Reclaim live-build work tree before scan
        # Only the finished *.hybrid.iso is needed downstream. Drop the chroot,
        # binary tree and .deb cache (many GB) so the scan, which extracts the ISO
        # and unsquashes its rootfs under /tmp, has headroom. --one-file-system
        # never descends into anything live-build might have left mounted.
        run: |
          echo "[disk] before cleanup:"; df -h /
          cd distro/live-build-config
          rm -rf --one-file-system chroot binary cache .build || true
          echo "[disk] after cleanup:"; df -h /
      - name: No-secret scan (iso)  # MANDATORY
        # bash, not the container default sh (dash): this block uses shopt, a bash
        # builtin. The host jobs default to bash; this container job does not.
        shell: bash
        run: |
          apt-get install -y libguestfs-tools qemu-utils bsdextrautils
          shopt -s nullglob
          for a in distro/live-build-config/*.hybrid.iso; do ci/no-secret-scan.sh "$a"; done
      - name: Stage ISO to out/
        run: |
          mkdir -p out
          cp distro/live-build-config/*.hybrid.iso out/vacti-engine-${VACTI_RELEASE}-${{ matrix.sku }}.iso || true
          ( cd out && sha256sum vacti-engine-${VACTI_RELEASE}-${{ matrix.sku }}.iso > vacti-engine-${VACTI_RELEASE}-${{ matrix.sku }}.iso.sha256 ) || true
      - name: Upload ISO artifacts
        uses: actions/upload-artifact@v4
        with:
          name: form-iso-${{ matrix.sku }}
          path: |
            out/*.iso
            out/*.iso.sha256
          retention-days: 2

  # --- smoke boot: prove each image enrolls + claims a job vs staging ----------
  smoke:
    needs: [fanout, iso]
    # Run once the forms actually built are green. On the golden+cloud path the
    # iso job is skipped, so accept skipped-iso; fanout must have succeeded.
    if: ${{ always() && needs.fanout.result == 'success' && (needs.iso.result == 'success' || needs.iso.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      # Same squeeze as golden/fanout: on the full matrix smoke fetches every
      # built form (~25GB: cloud qcow2 + raw.gz, both OVAs, both ISOs, golden)
      # and converts each OVA to a temp qcow2, past the runner's ~14GB free.
      # Reclaim >30GB first, before checkout or download.
      - name: Free disk space (reclaim >30GB on the runner)
        run: |
          echo "[disk] before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "[disk] after:"; df -h /
      - uses: actions/checkout@v4
      - name: Install qemu + tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage ovmf
      - name: Collect all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          pattern: "{form-*,golden-qcow2}"
      - name: Smoke-boot every built image (qemu TCG, real boot + health probe)
        # Boots each disk image (cloud qcow2 + both OVAs) in qemu with a throwaway
        # NoCloud health-probe seed and asserts a healthy multi-user boot with the
        # baked vacti units present + network up. ISOs (full-matrix only) are
        # boot-asserted (BIOS + UEFI). TCG (-cpu qemu64) so no /dev/kvm needed.
        # If STAGING_CP_URL + STAGING_ENROLL_TOKEN are set, the seed additionally
        # drives a real enroll roundtrip; otherwise the enroll assertion is skipped
        # (we never require a staging CP to exist for the gate to run).
        env:
          STAGING_CP_URL: ${{ vars.STAGING_CP_URL }}
          STAGING_ENROLL_TOKEN: ${{ secrets.STAGING_ENROLL_TOKEN }}
          BOOT_TIMEOUT: "900"
          # ISO legs reach a serial login/boot marker early now that the live
          # cmdline carries console=ttyS0; bound each leg's watch so a genuine
          # hang still fails in reasonable time under TCG (the loop breaks the
          # instant a marker appears, so a healthy ISO exits in minutes).
          ISO_WATCH: "600"
        run: ci/smoke-boot.sh out

  # --- publish as PRIVATE GitHub Release assets on this private repo -----------
  publish:
    needs: smoke
    runs-on: ubuntu-latest
    # The final no-secret scan below guestmounts each published qcow2/ova, so this
    # job needs the SAME libguestfs runner environment as golden/fanout: the
    # direct backend plus the readable-kernel / KVM / passt-AppArmor / userns
    # workarounds the composite action applies.
    env:
      LIBGUESTFS_BACKEND: direct
    steps:
      # Same squeeze as golden/fanout/iso/smoke: publish downloads EVERY built
      # form (~25GB on the full matrix) onto the runner's ~14GB free at "Collect
      # all artifacts"/"Flatten", so without this reclaim it ENOSPC's before it
      # can even assemble the release. This is the ONLY job that lacked the step.
      # (It does NOT fix the >2GiB-asset host limit - that is the separate,
      # operator-gated R2 wiring - but it lets the collect/flatten step run.)
      - name: Free disk space (reclaim >30GB on the runner)
        run: |
          echo "[disk] before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "[disk] after:"; df -h /
      - uses: actions/checkout@v4
      - name: Install libguestfs toolchain (+ runner workarounds)
        # WHY: the "Final no-secret scan gate" step guestmounts every published
        # artifact. Without the composite action's readable-kernel / KVM / passt
        # workarounds (and LIBGUESTFS_BACKEND=direct above) guestmount fails on the
        # GH-hosted runner, and the fail-closed scan refuses to publish the images
        # as UNSCANNED. This mirrors the fan-out job, whose identical guestmount
        # scan passes with exactly this setup. extra-packages are the non-base
        # tools the scan needs: bsdextrautils (raw.gz path), squashfs-tools
        # (unsquashfs for the ISO rootfs), xorriso (extract the ISO tree; the scan
        # needs bsdtar OR xorriso, and the iso job already uses xorriso), fuse3
        # (guestmount).
        uses: ./.github/actions/libguestfs-runner
        with:
          extra-packages: bsdextrautils squashfs-tools xorriso fuse3
      - name: Collect all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Flatten + reproducibility manifest
        run: |
          mkdir -p release
          find dist -type f \( -name '*.qcow2' -o -name '*.raw.gz' -o -name '*.ova' -o -name '*.iso' -o -name '*.sha256' \) \
            -exec cp -n {} release/ \;
          ( cd release && sha256sum ./*.qcow2 ./*.raw.gz ./*.ova ./*.iso 2>/dev/null > MANIFEST.sha256 || true )
      - name: Final no-secret scan gate (every published artifact)  # MANDATORY
        # The libguestfs toolchain + runner workarounds are installed above; this
        # step only runs the fail-closed scan over the assembled release/ set.
        run: |
          shopt -s nullglob
          for a in release/*.qcow2 release/*.raw.gz release/*.ova release/*.iso; do
            ci/no-secret-scan.sh "$a"
          done
      - name: Publish PRIVATE GitHub Release (assets stay private to this repo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: images-v${{ env.VACTI_RELEASE }}
          name: vacti images ${{ env.VACTI_RELEASE }}
          body: |
            vacti-distro images ${{ env.VACTI_RELEASE }} (Debian 13 trixie base).
            PRIVATE assets. No baked secret; images are inert without a vacti enrollment.
            See MANIFEST.sha256 for the reproducibility record.
          draft: false
          prerelease: true
          files: |
            release/*.qcow2
            release/*.raw.gz
            release/*.ova
            release/*.iso
            release/MANIFEST.sha256

  # --- universal multi-arch Docker image -> GHCR (TG 7182) --------------------
  # The container form of the appliance: debian:trixie-slim + the pinned Kali apt
  # source + the vacti-engine .deb from the private apt repo + the lean arsenal,
  # reproducing the golden disk's capability in a container (ephemeral
  # "docker run" pentest sessions, no VM/ISO). Published as a single multi-arch
  # manifest list (linux/amd64 + linux/arm64) to GHCR. It is INDEPENDENT of the
  # VM/ISO matrix above (it installs the engine from apt rather than guestmounting
  # a disk), so it does not need the golden disk and runs in parallel.
  #
  # The "depend on the engine .deb being published" requirement is satisfied by
  # the apt repo: an engine-deb-published dispatch fires only AFTER the upstream
  # engine release-deb pipeline has published the .deb, and the pre-build resolve
  # step below confirms the engine version is present for both arches before the
  # buildx legs pull it. No baked secret: the apt producer token is a BuildKit
  # secret mount, and the enrollment token is supplied per-run at "docker run".
  docker-publish-ghcr:
    # workflow_dispatch and the engine-deb-published dispatch always build; a bare
    # tag push builds ONLY this job (the VM/ISO matrix is skipped at lint).
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'repository_dispatch' || github.event_name == 'push' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write   # push to ghcr.io/anggipradana/vacti-distro
    steps:
      - uses: actions/checkout@v4

      - name: Resolve image version + tags
        id: ver
        run: |
          V="${VACTI_ENGINE_REF}"
          [ -z "$V" ] && V="${VACTI_RELEASE}"
          [ -z "$V" ] && V="0.2.411"
          V="${V#v}"
          IMAGE="ghcr.io/anggipradana/vacti-distro"
          {
            echo "version=${V}"
            echo "image=${IMAGE}"
            echo "tags=${IMAGE}:latest,${IMAGE}:${V}"
          } >> "$GITHUB_OUTPUT"
          echo "[docker] image tags: ${IMAGE}:latest, ${IMAGE}:${V}"

      - name: Pre-build resolve (confirm the engine version is in the apt repo for both arches)
        # Soft gate: the flat vacti apt repo serves one index for all arches. This
        # confirms the engine .deb is published (TG 7182 dependency) and reports
        # which arches are resolvable before the buildx legs pull it. Non-blocking:
        # the buildx apt install is the hard gate (it fails the build if the arch
        # .deb is truly absent); this step just surfaces a clear early signal.
        continue-on-error: true
        env:
          VACTI_APT_PRODUCER_TOKEN: ${{ secrets.VACTI_APT_PRODUCER_TOKEN }}
          ENGINE_VER: ${{ steps.ver.outputs.version }}
        run: |
          base="${VACTI_APT_URL:-https://itsai.sbs}"
          base="${base%/}/apt"
          idx="$(curl -fsSL -u "vacti:${VACTI_APT_PRODUCER_TOKEN}" "${base}/Packages" 2>/dev/null \
                 || curl -fsSL -u "vacti:${VACTI_APT_PRODUCER_TOKEN}" "${base}/Packages.gz" 2>/dev/null | gunzip -c 2>/dev/null \
                 || true)"
          if [ -z "$idx" ]; then
            echo "[docker][warn] could not read the apt index (token/path); the buildx apt install remains the hard gate"
            exit 0
          fi
          echo "[docker] vacti-engine entries matching ${ENGINE_VER} in the apt index:"
          echo "$idx" | awk 'BEGIN{RS="";FS="\n"} /Package: vacti-engine/ {print}' \
            | grep -E "Architecture:|Version:" | grep -E "${ENGINE_VER}|Architecture" || true
          for a in amd64 arm64; do
            if echo "$idx" | awk 'BEGIN{RS="";FS="\n"} /Package: vacti-engine/' | grep -q "Architecture: ${a}"; then
              echo "[docker] OK: vacti-engine present for ${a}"
            else
              echo "[docker][warn] vacti-engine NOT found for ${a} in the apt index (buildx ${a} leg may fail)"
            fi
          done

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push multi-arch image (linux/amd64 + linux/arm64)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: distro/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          provenance: false   # keep a clean 2-arch manifest list
          tags: ${{ steps.ver.outputs.tags }}
          build-args: |
            VACTI_APT_URL=${{ env.VACTI_APT_URL }}
            VACTI_ENGINE_PKG=vacti-engine
            VACTI_ENGINE_REF=${{ steps.ver.outputs.version }}
            VACTI_FULL_ARSENAL=${{ env.VACTI_FULL_ARSENAL }}
          secrets: |
            vacti_apt_token=${{ secrets.VACTI_APT_PRODUCER_TOKEN }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (pull the published tag + assert the engine is NOT baked)
        # Non-blocking: pulls the just-pushed manifest (docker auto-selects the
        # runner's amd64 child). THIN-BOOTSTRAP: the engine .deb is pulled at
        # container start, never baked, so the published image must contain NO
        # vacti-engine package and NO /usr/lib/vacti-engine, while the arsenal is
        # present.
        continue-on-error: true
        env:
          IMAGE: ${{ steps.ver.outputs.image }}
          ENGINE_VER: ${{ steps.ver.outputs.version }}
        run: |
          docker pull "${IMAGE}:${ENGINE_VER}"
          echo "[smoke] asserting the vacti-engine package is ABSENT (thin-bootstrap)"
          got="$(docker run --rm --entrypoint dpkg-query "${IMAGE}:${ENGINE_VER}" \
                   -W -f='${Version}' vacti-engine 2>/dev/null || true)"
          if [ -z "$got" ]; then echo "[smoke] OK: no vacti-engine package baked"; \
            else echo "[smoke][warn] vacti-engine ${got} is baked (IP-strip regression)"; fi
          echo "[smoke] asserting /usr/lib/vacti-engine is ABSENT from the image"
          docker run --rm --entrypoint sh "${IMAGE}:${ENGINE_VER}" \
            -c 'test ! -e /usr/lib/vacti-engine' \
            && echo "[smoke] OK: no engine tree baked" || echo "[smoke][warn] /usr/lib/vacti-engine present (IP-strip regression)"
          echo "[smoke] asserting the arsenal is present (e.g. nuclei/sqlmap/nmap)"
          docker run --rm --entrypoint sh "${IMAGE}:${ENGINE_VER}" \
            -c 'command -v nuclei >/dev/null || command -v sqlmap >/dev/null || command -v nmap >/dev/null' \
            && echo "[smoke] OK: arsenal present" || echo "[smoke][warn] arsenal missing (build regression)"
