# vacti-distro image build matrix.
#
# This is where the HEAVY build runs: GitHub Actions (OFF-PROD), never on the
# vacti control plane. It builds the golden disk once (GUI flavor), fans it out to
# the two GUI OVA forms (VMware OVA + VirtualBox OVA), runs the MANDATORY no-secret
# scan on every emitted artifact, smoke-boots each, publishes them as PRIVATE
# GitHub Release assets on this (private) repo, then publishes the large images to
# Hugging Face INLINE (publish-hf job -> publish-images-hf.yml via workflow_call).
#
# P0-3: the universal multi-arch Docker image is NOT built here any more. It lives in
# its own workflow (build-docker.yml), so a Docker failure can never turn this OVA
# run red, and this run's conclusion reflects the OVA pipeline only.
#
# Operator scope (TG 7503/7505): VMware + VirtualBox OVA, GUI only, amd64 (arm64
# is the companion build-arm64.yml) + multi-arch Docker. The headless, cloud and
# ISO forms were removed as out-of-scope ("hapus semua yg ga diperlukan").
#
# Triggered manually (watch-engine-apt self-dispatches it), or by a repository_dispatch
# from the engine release-deb pipeline after a new vacti-engine .deb is published.
name: build-images
# The release is in the run title so build-arm64.yml's publish guard can find the
# amd64 run for the same release (P1-3).
run-name: build-images ${{ inputs.release || github.event.client_payload.release || '' }}

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Engine release X.Y.Z to stamp + bake (the 0.1.0 placeholder is refused unless allow_legacy_release=true)"
        required: true
        default: "0.1.0"
      engine_ref:
        description: "Optional explicit vacti-engine version to bake (default: = release)"
        required: false
        default: ""
      allow_legacy_release:
        description: "Override the guard that refuses release=0.1.0 / < 0.2.400 (never advances the HF headline)"
        required: false
        type: boolean
        default: false
      full_arsenal:
        description: "Bake the full arsenal (1) or lean web+infra (0)"
        required: false
        default: "1"
      ctf_arsenal:
        description: "Also bake the CTF tool set (1) or not (0)"
        required: false
        default: "1"
      fat_ova:
        description: "FAT-OVA: bake the engine + chromium .debs into the image (1) or stay THIN/first-boot (0)"
        required: false
        default: "1"
      forms:
        description: "Which image forms to build"
        required: false
        type: choice
        default: "vbox-vmware-gui"
        options:
          # Operator scope (TG 7503/7505): VMware OVA + VirtualBox OVA, GUI only,
          # both arches (arm64 via build-arm64.yml) + multi-arch Docker. The dead
          # 'all' (never cleared the ~50 GiB release cap) and 'golden+cloud'
          # (cloud removed) options were pruned, along with the headless/cloud/iso
          # forms. This is now the only build shape.
          - "vbox-vmware-gui"   # golden(gui) -> vmware-ova(gui) + vbox-ova(gui) -> smoke -> publish (+ multi-arch Docker)
  repository_dispatch:
    types: [engine-deb-published]
  # (The former tag-push trigger only ever built the Docker image; it moved with the
  # Docker job to build-docker.yml.)

permissions:
  contents: write   # create/attach PRIVATE release assets on this private repo

env:
  VACTI_RELEASE: ${{ github.event.inputs.release || github.event.client_payload.release || '0.1.0' }}
  # Default 1 (full): published artifacts MUST ship the full 110-pkg arsenal
  # (grant+core+verticals+ctf) on EVERY trigger - manual dispatch, tag push, and
  # the automated engine-deb-published rebuild alike - so an auto-rebuild never
  # silently reverts the published :latest/:0.1.0 to the lean set. A lean build is
  # an explicit opt-in: dispatch with full_arsenal=0 (a non-empty "0" input wins
  # over this default via the `||` short-circuit).
  VACTI_FULL_ARSENAL: ${{ github.event.inputs.full_arsenal || '1' }}
  # CTF tool set toggle. Honored by build-golden.sh (via vacti-appliance.env,
  # which reads VACTI_CTF_ARSENAL from the environment) for the OVA/cloud forms
  # and fed to the Dockerfile as a build-arg for the container form, so with both
  # defaults at 1 every surface bakes the ENTIRE arsenal (core superset incl.
  # mobile/ios/re verticals + the CTF apt set). Pass ctf_arsenal=0 to opt out.
  VACTI_CTF_ARSENAL: ${{ github.event.inputs.ctf_arsenal || '1' }}
  # FAT-OVA (default 1): bake the vacti-engine app .deb + vacti-engine-chromium .deb
  # into the golden disk at build time so the OVA/cloud forms enroll offline with no
  # first-boot apt pull. The "Fetch engine + chromium .debs" step stages them from
  # the private apt pool into ENGINE_DEBS_DIR; build-golden.sh gates on VACTI_FAT_OVA
  # and gracefully falls back to THIN if the .debs are unavailable. Pass fat_ova=0 to
  # force a thin image. Docker stays THIN regardless (handled in its own job).
  VACTI_FAT_OVA: ${{ github.event.inputs.fat_ova || '1' }}
  # Pinned engine ref the image builds against (P1-2). The authoritative value is
  # resolved by ci/resolve-release.sh in the lint job (explicit engine_ref input >
  # client_payload.release > inputs.release > vars.VACTI_ENGINE_REF) and threaded to
  # the lint steps + golden job as steps.rel / needs.lint.outputs.engine_ref; this
  # workflow-level value is only a fallback default.
  VACTI_ENGINE_REF: ${{ github.event.inputs.engine_ref || github.event.client_payload.release || vars.VACTI_ENGINE_REF || '' }}
  # Form scoping. There is now a single build shape (vbox-vmware-gui): golden(gui)
  # -> vmware-ova(gui) + vbox-ova(gui). Both workflow_dispatch and the input-less
  # repository_dispatch (engine-deb-published) resolve to it.
  VACTI_FORMS: ${{ github.event.inputs.forms || 'vbox-vmware-gui' }}
  VACTI_APT_URL: ${{ vars.VACTI_APT_URL }}
  # Build-time private-repo credential. A build-time secret, NEVER baked into an
  # image (the build strips it before finalize; the no-secret scan re-verifies).
  VACTI_APT_PRODUCER_TOKEN: ${{ secrets.VACTI_APT_READ_TOKEN }}
  # Build-time appliance login password for the default 'arparp' local admin user
  # (build-golden.sh:chpasswd). Required: build-golden.sh fails closed if unset.
  # Lives only on the CI runner RAM + the throwaway provision.sh host copy that
  # build-golden.sh deletes after virt-customize runs; NEVER on the golden disk
  # as cleartext (the in-guest copy is wiped by --run-command's trailing rm).
  ARPARP_PASSWORD: ${{ secrets.ARPARP_PASSWORD }}
  OUT_DIR: out

jobs:
  # --- light gate: shellcheck + yaml/xml sanity (fast, no image build) --------
  lint:
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.rel.outputs.release }}
      engine_ref: ${{ steps.rel.outputs.engine_ref }}
      legacy: ${{ steps.rel.outputs.legacy }}
      publish_latest: ${{ steps.rel.outputs.publish_latest }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve release + engine ref (refuses the 0.1.0 placeholder unless overridden)
        id: rel
        env:
          IN_RELEASE: ${{ github.event.inputs.release }}
          IN_ENGINE_REF: ${{ github.event.inputs.engine_ref }}
          IN_ALLOW_LEGACY: ${{ github.event.inputs.allow_legacy_release }}
          PAYLOAD_RELEASE: ${{ github.event.client_payload.release }}
          VAR_ENGINE_REF: ${{ vars.VACTI_ENGINE_REF }}
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
        run: ci/resolve-release.sh
      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml libxml2-utils
      # AUTO-REVENDOR (auto-triggered rebuilds only). An engine-deb-published
      # dispatch pins VACTI_ENGINE_REF to the just-published release; the engine
      # arsenal set may legitimately have drifted from the committed snapshot, which
      # would red-lint arsenal-sync-check below. Re-vendor the snapshot IN-WORKSPACE
      # from the engine's authoritative manifest for that ref (same resolver the lint
      # guard uses) FIRST, so the auto-rebuild stays green. A normal manual
      # workflow_dispatch does NOT match this guard, so it keeps the COMMITTED
      # snapshot and arsenal-sync-check's drift detection stays live. Soft if no
      # reference is reachable (apt creds absent) - the committed snapshot is kept.
      - name: Auto-revendor arsenal manifest (engine-deb-published only)
        if: ${{ github.event_name == 'repository_dispatch' }}
        env:
          VACTI_ENGINE_REF: ${{ steps.rel.outputs.engine_ref }}
        run: ci/revendor-arsenal.sh
      - name: Lint build sources
        env:
          VACTI_ENGINE_REF: ${{ steps.rel.outputs.engine_ref }}
        run: ci/lint.sh

  # --- the golden disk: built ONCE, shared by all VM/cloud forms --------------
  # PINNED ubuntu-24.04: GitHub promoted ubuntu-latest to 26.04 on 2026-11-13 and the
  # new libguestfs 1.58.1 + passt networking helper breaks the virt-customize
  # appliance VM entirely (no outbound network, link-local dhcpcd lease, the
  # build-golden.sh static-address fallback does not trigger because the lease is
  # already set). Last green run was 24.04 on 2026-11-13. See audit RF5
  # (scratchpad/regression-check/research/RF5-golden-ova-dns.md) for the root cause
  # and the Option G follow-up (remove passt + fall through to SLIRP) that will
  # replace this pin once 24.04 is retired.
  golden:
    needs: lint
    runs-on: ubuntu-24.04
    env:
      # P1-2: the exact engine version fetch-engine-debs.sh stages and build-golden.sh
      # verifies before baking (fail-closed on any other version).
      VACTI_ENGINE_REF: ${{ needs.lint.outputs.engine_ref }}
    strategy:
      fail-fast: false
      matrix:
        # Operator scope (TG 7503): GUI only. The golden disk is built once in the
        # gui flavor and is the shared conversion source for both OVA fan-out forms.
        flavor: [gui]
    steps:
      # Hosted Ubuntu runners ship ~14GB free; the golden qcow2 (~2GB raw, grown
      # to give the appliance room) plus the downloaded Debian base image exhaust
      # it. Reclaim >30GB by dropping pre-installed toolchains this build never
      # uses. Runs FIRST, before any checkout or build.
      - name: Free disk space (reclaim >30GB on the runner)
        run: |
          echo "[disk] before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "[disk] after:"; df -h /
      - uses: actions/checkout@v4
      - name: Install libguestfs + qemu toolchain (+ runner workarounds)
        uses: ./.github/actions/libguestfs-runner
        with:
          extra-packages: genisoimage xorriso
      - name: Fetch engine + chromium .debs for the FAT-OVA bake (amd64)
        # FAT-OVA (VACTI_FAT_OVA=1): stage the vacti-engine app .deb (pinned to
        # VACTI_ENGINE_REF) + the vacti-engine-chromium .deb so build-golden.sh bakes
        # them into the golden disk. Source is the PRIVATE apt pool (producer token,
        # CI-host only, never baked), GitHub release as fallback. FAIL-LOUD (P1-4): an
        # HTTP error, SHA256 mismatch, version drift or a missing .deb fails this step;
        # a THIN image is an explicit choice (fat_ova=0).
        if: ${{ env.VACTI_FAT_OVA != '0' }}
        env:
          VACTI_APT_PRODUCER_TOKEN: ${{ secrets.VACTI_APT_READ_TOKEN }}
          VACTI_ENGINE_REF: ${{ needs.lint.outputs.engine_ref }}
          GH_TOKEN: ${{ secrets.VACTI_ENGINE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ENGINE_DEBS_DIR="${{ github.workspace }}/engine-debs"
          ci/fetch-engine-debs.sh amd64 "$ENGINE_DEBS_DIR"
          echo "ENGINE_DEBS_DIR=$ENGINE_DEBS_DIR" >> "$GITHUB_ENV"
      - name: Build golden disk (virt-customize, off-prod)
        env:
          VACTI_FLAVOR: ${{ matrix.flavor }}
        run: |
          export LIBGUESTFS_BACKEND=direct
          # TEMP: full libguestfs trace so the exact passt invocation (guest
          # address/gateway/DNS scheme) is logged; reverted once green.
          export LIBGUESTFS_DEBUG=1 LIBGUESTFS_TRACE=1
          make golden
      - name: No-secret scan (golden)
        run: ci/no-secret-scan.sh out/vacti-engine-${VACTI_RELEASE}-${{ matrix.flavor }}-golden.qcow2
      - name: Reclaim intermediate build files before upload
        # Only out/vacti-engine-<ver>-golden.qcow2 is needed downstream. The
        # downloaded Debian base image + virt-customize work tree under
        # distro/.build are no longer required and would otherwise be snapshotted
        # by later steps; drop them to leave headroom for the upload.
        run: |
          echo "[disk] before cleanup:"; df -h /
          rm -rf distro/.build || true
          echo "[disk] after cleanup:"; df -h /
      - name: Upload golden as a build artifact (passed to fan-out jobs)
        uses: actions/upload-artifact@v4
        with:
          name: golden-qcow2-${{ matrix.flavor }}
          path: |
            out/vacti-engine-${{ env.VACTI_RELEASE }}-${{ matrix.flavor }}-golden.qcow2
          retention-days: 2
          if-no-files-found: error

  # --- fan-out: each VM/cloud form is a repackaging of the SAME golden disk ----
  # PINNED ubuntu-24.04 (same libguestfs reason as golden above).
  fanout:
    needs: golden
    runs-on: ubuntu-24.04
    # The no-secret scan below guestmounts the converted qcow2, so this job needs
    # the SAME libguestfs runner environment as golden: the direct backend plus
    # the kernel/KVM/passt-AppArmor/userns workarounds in the composite action.
    env:
      LIBGUESTFS_BACKEND: direct
    strategy:
      fail-fast: false
      matrix:
        # Operator scope (TG 7503/7505): VMware OVA + VirtualBox OVA, GUI only. No
        # cloud, no headless, no iso. Each (form,gui) cell converts the shared
        # golden-qcow2-gui disk.
        form: [vmware-ova, vbox-ova]
        flavor: [gui]
    steps:
      # Same squeeze as golden: the fetched golden qcow2 (~2GB) plus the
      # converted form (raw.gz / streamOptimized VMDK / .ova) blow past the
      # runner's ~14GB free. Reclaim >30GB first, before checkout or download.
      - name: Free disk space (reclaim >30GB on the runner)
        run: |
          echo "[disk] before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "[disk] after:"; df -h /
      - uses: actions/checkout@v4
      - name: Install toolchain (+ runner workarounds)
        uses: ./.github/actions/libguestfs-runner
        with:
          # fuse3 for guestmount; libxml2-utils (xmllint) for the OVF gate.
          extra-packages: fuse3 libxml2-utils
      - name: Fetch the golden disk (${{ matrix.flavor }})
        uses: actions/download-artifact@v4
        with:
          name: golden-qcow2-${{ matrix.flavor }}
          path: out
      - name: Convert -> ${{ matrix.form }} (${{ matrix.flavor }})
        env:
          VACTI_FLAVOR: ${{ matrix.flavor }}
        run: make ${{ matrix.form }}
      - name: Validate OVF/OVA structure (member order, schema, sizes, hashes, RAM floor)
        # FOSS, offline structural gate for the hand-authored OVFs. No-op for the
        # cloud form (it emits no .ova). Catches the mechanical spec errors that a
        # bare tar + .mf cannot; the real-import check is the dev-box ovftool lane.
        run: |
          shopt -s nullglob
          ovas=(out/*.ova)
          if [[ ${#ovas[@]} -gt 0 ]]; then
            ci/validate-ovf.sh "${ovas[@]}"
          else
            echo "[validate-ovf] no .ova in this form (${{ matrix.form }}); skipping"
          fi
      - name: Reclaim golden disk after conversion
        # The golden qcow2 (~2GB) is only the conversion SOURCE - it is neither
        # scanned (the scan skips *golden*) nor uploaded by this job. Drop it now
        # so the mandatory scan (which gzip-decompresses raw.gz / qemu-img
        # converts the OVA's VMDK to a temp raw) and the upload have headroom.
        run: |
          echo "[disk] before cleanup:"; df -h /
          rm -f out/*golden*.qcow2 || true
          echo "[disk] after cleanup:"; df -h /
      - name: No-secret scan (${{ matrix.form }})  # MANDATORY, non-negotiable
        # no-secret-scan.sh guestmounts each artifact read-only and unmounts +
        # removes its temp mountpoints via a trap on EXIT, so nothing stays
        # mounted or staged before the upload step.
        run: |
          shopt -s nullglob
          for a in out/*.qcow2 out/*.raw.gz out/*.ova; do
            case "$a" in *golden*) continue;; esac
            ci/no-secret-scan.sh "$a"
          done
      - name: Upload ${{ matrix.form }} (${{ matrix.flavor }}) artifacts
        uses: actions/upload-artifact@v4
        with:
          name: form-${{ matrix.form }}-${{ matrix.flavor }}
          path: |
            out/*.ova
            out/*.sha256
          retention-days: 2

  # --- smoke boot: prove each image enrolls + claims a job vs staging ----------
  # PINNED ubuntu-24.04 (same libguestfs reason as golden above).
  smoke:
    needs: [fanout]
    runs-on: ubuntu-24.04
    steps:
      # Same squeeze as golden/fanout: on the full matrix smoke fetches every
      # built form (~25GB: cloud qcow2 + raw.gz, both OVAs, both ISOs, golden)
      # and converts each OVA to a temp qcow2, past the runner's ~14GB free.
      # Reclaim >30GB first, before checkout or download.
      - name: Free disk space (reclaim >30GB on the runner)
        run: |
          echo "[disk] before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "[disk] after:"; df -h /
      - uses: actions/checkout@v4
      - name: Install qemu + tools
        run: sudo apt-get update && sudo apt-get install -y qemu-system-x86 qemu-utils genisoimage ovmf
      - name: Collect all artifacts
        uses: actions/download-artifact@v4
        with:
          path: out
          pattern: "{form-*,golden-qcow2-*}"
      - name: Smoke-boot every built image (qemu TCG, real boot + health probe)
        # Boots each OVA (vmware-ova + vbox-ova, gui) in qemu with a throwaway
        # NoCloud health-probe seed and asserts a healthy multi-user boot with the
        # baked vacti units present + network up. TCG (-cpu qemu64) so no /dev/kvm
        # needed. If STAGING_CP_URL + STAGING_ENROLL_TOKEN are set, the seed
        # additionally drives a real enroll roundtrip; otherwise the enroll
        # assertion is skipped (we never require a staging CP to exist for the gate).
        env:
          STAGING_CP_URL: ${{ vars.STAGING_CP_URL }}
          STAGING_ENROLL_TOKEN: ${{ secrets.STAGING_ENROLL_TOKEN }}
          BOOT_TIMEOUT: "900"
        run: ci/smoke-boot.sh out

  # --- publish as PRIVATE GitHub Release assets on this private repo -----------
  # PINNED ubuntu-24.04 (same libguestfs reason as golden above).
  publish:
    needs: smoke
    runs-on: ubuntu-24.04
    # The final no-secret scan below guestmounts each published qcow2/ova, so this
    # job needs the SAME libguestfs runner environment as golden/fanout: the
    # direct backend plus the readable-kernel / KVM / passt-AppArmor / userns
    # workarounds the composite action applies.
    env:
      LIBGUESTFS_BACKEND: direct
    steps:
      # Same squeeze as golden/fanout/smoke: publish downloads the two built OVAs
      # (vmware-ova + vbox-ova, gui) onto the runner's ~14GB free at "Collect all
      # artifacts"/"Flatten". The Flatten step moves (not copies) images so peak
      # stays ~1x. (It does NOT fix the >2GiB-asset host limit - that is the
      # separate, operator-gated R2 wiring - but it lets the collect/flatten run.)
      - name: Free disk space (reclaim >30GB on the runner)
        run: |
          echo "[disk] before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "[disk] after:"; df -h /
      - uses: actions/checkout@v4
      - name: Install libguestfs toolchain (+ runner workarounds)
        # WHY: the "Final no-secret scan gate" step guestmounts every published
        # artifact. Without the composite action's readable-kernel / KVM / passt
        # workarounds (and LIBGUESTFS_BACKEND=direct above) guestmount fails on the
        # GH-hosted runner, and the fail-closed scan refuses to publish the images
        # as UNSCANNED. This mirrors the fan-out job, whose identical guestmount
        # scan passes with exactly this setup. extra-packages are the non-base
        # tools the scan needs: bsdextrautils (raw.gz path), squashfs-tools
        # (unsquashfs for the ISO rootfs), xorriso (extract the ISO tree; the scan
        # needs bsdtar OR xorriso, and the iso job already uses xorriso), fuse3
        # (guestmount).
        uses: ./.github/actions/libguestfs-runner
        with:
          extra-packages: bsdextrautils squashfs-tools xorriso fuse3
      - name: Collect all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          # Scope to the two OVA artifacts. The golden qcow2 is a build-only source
          # (never a deliverable), so it is NOT fetched here. The pattern also keeps
          # the stray ~372KB .dockerbuild artifact out of the collect step.
          pattern: "form-*"
      - name: Flatten + reproducibility manifest
        run: |
          mkdir -p release
          # MOVE (not copy) each image dist/ -> release/: dist/ and release/ are on
          # the same filesystem so this is a rename (near-zero extra space), where
          # 'cp' would hold BOTH copies at once (~2x). Nothing reads dist/ after this
          # step (scan + publish read release/ only). -n keeps no-clobber semantics.
          find dist -type f \( -name '*.ova' -o -name '*.sha256' \) \
            -exec mv -n {} release/ \;
          ( cd release && sha256sum ./*.ova 2>/dev/null > MANIFEST.sha256 || true )
      - name: Final no-secret scan gate (every published artifact)  # MANDATORY
        # The libguestfs toolchain + runner workarounds are installed above; this
        # step only runs the fail-closed scan over the assembled release/ set.
        run: |
          shopt -s nullglob
          for a in release/*.ova; do
            ci/no-secret-scan.sh "$a"
          done
      - name: Enforce the 2GiB Release asset cap (log + continue; does not solve R2)
        # GitHub Releases reject a single asset > 2 GiB and softprops/action-gh-
        # release aborts the WHOLE release on the first over-cap upload. A full-
        # arsenal OVA can exceed 2 GiB, so this moves any over-cap file out of
        # release/ (into release/over-cap/) with a warning so every in-limit asset
        # still publishes; over-cap files are fetched via 'gh run download' + the
        # operator-gated R2 mirror and remain listed in MANIFEST.sha256. Same
        # graceful behavior as the arm64 publish.
        run: ci/cap-release-assets.sh release 2147483648
      - name: Publish PRIVATE GitHub Release (assets stay private to this repo)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: images-v${{ env.VACTI_RELEASE }}
          name: vacti images ${{ env.VACTI_RELEASE }}
          body: |
            vacti-distro images ${{ env.VACTI_RELEASE }} (Debian 13 trixie base).
            PRIVATE assets. No baked secret; images are inert without a vacti enrollment.
            See MANIFEST.sha256 for the reproducibility record.
          draft: false
          prerelease: true
          files: |
            release/*.ova
            release/MANIFEST.sha256

  # --- Hugging Face publish, INLINE (P0-2) ----------------------------------------
  # publish-images-hf.yml used to listen on `workflow_run`, which GitHub never fires
  # for a run started by GITHUB_TOKEN - and watch-engine-apt dispatches every build
  # with GITHUB_TOKEN, so HF stalled at 0.2.449. It is now a reusable workflow called
  # right here, after the OVA release published, against THIS run's form-* artifacts.
  # A legacy (allow_legacy_release) build never publishes to HF.
  publish-hf:
    needs: [lint, publish]
    if: ${{ needs.lint.outputs.legacy != 'true' }}
    permissions:
      actions: read
      contents: read
    uses: ./.github/workflows/publish-images-hf.yml
    with:
      run_id: ${{ format('{0}', github.run_id) }}
      version: ${{ needs.lint.outputs.release }}
      arch: amd64
    secrets: inherit

  # --- G3a: amd64 vacti-tunnel sidecar binary (belt-and-braces) --------------------
  # The baked engine .deb already carries /usr/lib/vacti-engine/bin/vacti-tunnel, so the images get the
  # sidecar for free. This independent job ALSO emits the amd64 binary as a run artifact via the shared
  # connector helper (byte-for-byte the connector image's build), so this release's image pipeline has a
  # standalone, version-keyed copy for staging/debugging. No `needs:`, so it never turns the OVA chain red.
  tunnel-binary:
    name: cross-build vacti-tunnel (amd64)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: connector/go.mod
      - name: Resolve connector version
        id: ver
        run: echo "version=$(tr -d '[:space:]' < connector/VERSION)" >> "$GITHUB_OUTPUT"
      - name: Cross-build vacti-tunnel (amd64) via the shared helper
        run: bash connector/scripts/build-tunnel.sh amd64 "out/vacti-tunnel-amd64"
      - name: Upload vacti-tunnel (amd64)
        uses: actions/upload-artifact@v4
        with:
          name: vacti-tunnel-amd64-${{ steps.ver.outputs.version }}
          path: out/vacti-tunnel-amd64
          if-no-files-found: error
