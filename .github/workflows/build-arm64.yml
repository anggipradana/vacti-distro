# vacti-distro ARM64 image build matrix (TG 7182).
#
# Companion to build.yml. This workflow builds the ARM64 image forms NATIVELY on
# ubuntu-24.04-arm runners (no QEMU-user cross-build): virt-customize's in-guest
# apt/postinst run target-arch binaries directly, so uname-based hooks (ghidra JDK,
# caido) auto-select the aarch64 assets.
#
# Operator scope (TG 7503/7505): the two ARM64 OVA deliverables, GUI only -
# VirtualBox OVA + VMware OVA. The golden disk is the shared conversion source for
# both. The headless flavors and the ISO forms were removed as out-of-scope
# ("hapus semua yg ga diperlukan"). All ARM64 artifacts are "-arm64"-tagged
# (DEBIAN_ARCH drives VACTI_ARCH_SUFFIX in vacti-appliance.env), so they never
# collide with the AMD64 names.
#
# ARM64 is UEFI-only (hardware reality). OVA import is on an arm64-host hypervisor
# (VirtualBox 7.1+ / VMware Fusion 13 on Apple Silicon); the real-import check
# stays the dev-box ovftool/VBoxManage lane, same as AMD64.
#
# Triggered manually, or by the same engine-deb-published dispatch build.yml uses.
name: build-images-arm64

on:
  workflow_dispatch:
    inputs:
      release:
        description: "Release version to stamp (e.g. 0.1.0)"
        required: true
        default: "0.1.0"
      full_arsenal:
        description: "Bake the full arsenal (1) or lean web+infra (0)"
        required: false
        default: "1"
      ctf_arsenal:
        description: "Also bake the CTF tool set (1) or not (0)"
        required: false
        default: "1"
      fat_ova:
        description: "FAT-OVA: bake the engine + chromium .debs into the image (1) or stay THIN/first-boot (0)"
        required: false
        default: "1"
      forms:
        description: "Which ARM64 image forms to build"
        required: false
        type: choice
        default: "vbox-vmware-gui"
        options:
          # Operator scope (TG 7503/7505): VMware OVA + VirtualBox OVA, GUI only.
          # The dead 'all' (headless + ISO + ~50 GiB release cap) and 'vbox-ova'
          # (headless) options were pruned. This is now the only build shape.
          - "vbox-vmware-gui"   # golden(gui) -> vmware-ova(gui) + vbox-ova(gui) -> smoke -> publish
  repository_dispatch:
    types: [engine-deb-published]

permissions:
  contents: write   # append ARM64 assets to the PRIVATE release on this repo

concurrency:
  group: build-images-arm64-${{ github.event.inputs.release || github.event.client_payload.release || '0.1.0' }}
  cancel-in-progress: false

env:
  VACTI_RELEASE: ${{ github.event.inputs.release || github.event.client_payload.release || '0.1.0' }}
  # Default 1 (full): the published arm64 OVA/ISO artifacts MUST ship the full
  # arsenal on every trigger (manual, tag push, automated engine-deb-published),
  # matching amd64, so an auto-rebuild never reverts them to the lean set. Lean is
  # explicit opt-in: dispatch with full_arsenal=0 (a non-empty "0" wins over this
  # default via `||`).
  VACTI_FULL_ARSENAL: ${{ github.event.inputs.full_arsenal || '1' }}
  # CTF tool set toggle (arm64 OVA/ISO). Honored by build-golden.sh via
  # vacti-appliance.env, same as amd64; with both defaults at 1 the arm64 forms
  # bake the entire arsenal too. Pass ctf_arsenal=0 to opt out.
  VACTI_CTF_ARSENAL: ${{ github.event.inputs.ctf_arsenal || '1' }}
  # FAT-OVA (default 1): bake the arm64 vacti-engine + vacti-engine-chromium .debs
  # into the golden disk so the arm64 OVA forms enroll offline (no first-boot apt
  # pull). The "Fetch engine + chromium .debs" step stages the _arm64.deb variants
  # into ENGINE_DEBS_DIR; build-golden.sh falls back to THIN if they're unavailable.
  VACTI_FAT_OVA: ${{ github.event.inputs.fat_ova || '1' }}
  VACTI_ENGINE_REF: ${{ vars.VACTI_ENGINE_REF || github.event.client_payload.release || '' }}
  VACTI_APT_URL: ${{ vars.VACTI_APT_URL }}
  VACTI_APT_PRODUCER_TOKEN: ${{ secrets.VACTI_APT_PRODUCER_TOKEN }}
  # Build-time appliance login password for the default 'arparp' local admin user
  # (build-golden.sh:chpasswd). Required: build-golden.sh fails closed if unset.
  ARPARP_PASSWORD: ${{ secrets.ARPARP_PASSWORD }}
  # Every job targets arm64. vacti-appliance.env turns this into the "-arm64"
  # artifact suffix and the arm64 cloud-image / kernel-flavour / bootloader choices.
  DEBIAN_ARCH: arm64
  OUT_DIR: out

jobs:
  # --- light gate: shellcheck + yaml/xml sanity (arch-agnostic) ----------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install linters
        run: sudo apt-get update && sudo apt-get install -y shellcheck python3-yaml libxml2-utils
      - name: Auto-revendor arsenal manifest (engine-deb-published only)
        if: ${{ github.event_name == 'repository_dispatch' }}
        run: ci/revendor-arsenal.sh
      - name: Lint build sources
        run: ci/lint.sh

  # --- the golden disk (arm64): built ONCE, shared by both OVA forms -----------
  golden:
    needs: lint
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        # Operator scope (TG 7503): GUI only. The golden disk is built once in the
        # gui flavor and is the shared conversion source for both OVA fan-out forms.
        flavor: [gui]
    steps:
      - name: Free disk space (reclaim >30GB on the runner)
        run: |
          echo "[disk] before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "[disk] after:"; df -h /
      - uses: actions/checkout@v4
      - name: Install libguestfs + qemu toolchain (+ runner workarounds)
        uses: ./.github/actions/libguestfs-runner
        with:
          extra-packages: genisoimage xorriso
      - name: Fetch engine + chromium .debs for the FAT-OVA bake (arm64)
        # FAT-OVA (VACTI_FAT_OVA=1): stage the arm64 vacti-engine + vacti-engine-chromium
        # .debs so build-golden.sh bakes them into the arm64 golden disk. Private apt
        # pool first (producer token, CI-host only), GitHub release fallback. Soft: an
        # empty ENGINE_DEBS_DIR makes build-golden.sh fall back to THIN first-boot.
        if: ${{ env.VACTI_FAT_OVA != '0' }}
        env:
          VACTI_APT_PRODUCER_TOKEN: ${{ secrets.VACTI_APT_PRODUCER_TOKEN }}
          VACTI_ENGINE_REF: ${{ env.VACTI_ENGINE_REF }}
          GH_TOKEN: ${{ secrets.VACTI_ENGINE_REPO_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          ENGINE_DEBS_DIR="${{ github.workspace }}/engine-debs"
          ci/fetch-engine-debs.sh arm64 "$ENGINE_DEBS_DIR"
          echo "ENGINE_DEBS_DIR=$ENGINE_DEBS_DIR" >> "$GITHUB_ENV"
      - name: Build golden disk (virt-customize, native arm64, off-prod)
        env:
          VACTI_FLAVOR: ${{ matrix.flavor }}
        run: |
          export LIBGUESTFS_BACKEND=direct
          export LIBGUESTFS_DEBUG=1 LIBGUESTFS_TRACE=1
          make golden
      - name: No-secret scan (golden)
        run: ci/no-secret-scan.sh out/vacti-engine-${VACTI_RELEASE}-arm64-${{ matrix.flavor }}-golden.qcow2
      - name: Reclaim intermediate build files before upload
        run: |
          echo "[disk] before cleanup:"; df -h /
          rm -rf distro/.build || true
          echo "[disk] after cleanup:"; df -h /
      - name: Upload golden as a build artifact (passed to fan-out jobs)
        uses: actions/upload-artifact@v4
        with:
          name: golden-qcow2-${{ matrix.flavor }}-arm64
          path: |
            out/vacti-engine-${{ env.VACTI_RELEASE }}-arm64-${{ matrix.flavor }}-golden.qcow2
          retention-days: 2
          if-no-files-found: error

  # --- fan-out: the two OVA forms, each a repackaging of the golden disk -------
  fanout:
    needs: golden
    runs-on: ubuntu-24.04-arm
    env:
      LIBGUESTFS_BACKEND: direct
    strategy:
      fail-fast: false
      matrix:
        # Operator scope (TG 7503/7505): VMware OVA + VirtualBox OVA, GUI only. No
        # headless, no iso. Each (form,gui) cell converts the shared
        # golden-qcow2-gui-arm64 disk.
        form: [vmware-ova, vbox-ova]
        flavor: [gui]
    steps:
      - name: Free disk space (reclaim >30GB on the runner)
        run: |
          echo "[disk] before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "[disk] after:"; df -h /
      - uses: actions/checkout@v4
      - name: Install toolchain (+ runner workarounds)
        uses: ./.github/actions/libguestfs-runner
        with:
          extra-packages: fuse3 libxml2-utils
      - name: Fetch the golden disk (${{ matrix.flavor }})
        uses: actions/download-artifact@v4
        with:
          name: golden-qcow2-${{ matrix.flavor }}-arm64
          path: out
      - name: Convert -> ${{ matrix.form }} (${{ matrix.flavor }})
        env:
          VACTI_FLAVOR: ${{ matrix.flavor }}
        run: make ${{ matrix.form }}
      - name: Validate OVF/OVA structure (member order, schema, sizes, hashes, RAM floor)
        run: |
          shopt -s nullglob
          ovas=(out/*.ova)
          if [[ ${#ovas[@]} -gt 0 ]]; then
            ci/validate-ovf.sh "${ovas[@]}"
          else
            echo "[validate-ovf] no .ova in this form (${{ matrix.form }}); skipping"
          fi
      - name: Reclaim golden disk after conversion
        run: |
          echo "[disk] before cleanup:"; df -h /
          rm -f out/*golden*.qcow2 || true
          echo "[disk] after cleanup:"; df -h /
      - name: No-secret scan (${{ matrix.form }})  # MANDATORY, non-negotiable
        run: |
          shopt -s nullglob
          for a in out/*.qcow2 out/*.raw.gz out/*.ova; do
            case "$a" in *golden*) continue;; esac
            ci/no-secret-scan.sh "$a"
          done
      - name: Upload ${{ matrix.form }} (${{ matrix.flavor }}) artifacts
        uses: actions/upload-artifact@v4
        with:
          name: form-${{ matrix.form }}-${{ matrix.flavor }}-arm64
          path: |
            out/*.ova
            out/*.sha256
          retention-days: 2

  # --- smoke boot (arm64): native qemu-system-aarch64. NON-BLOCKING ------------
  smoke:
    needs: [fanout]
    runs-on: ubuntu-24.04-arm
    # Non-blocking per TG 7182: a slow or flaky TCG boot must not gate the ARM64
    # artifacts (the mandatory gate is the no-secret scan + OVF structure check).
    continue-on-error: true
    steps:
      - name: Free disk space (reclaim >30GB on the runner)
        run: |
          echo "[disk] before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "[disk] after:"; df -h /
      - uses: actions/checkout@v4
      - name: Install qemu (aarch64) + AAVMF firmware + tools
        run: |
          sudo apt-get update
          # qemu-system-arm provides qemu-system-aarch64; qemu-efi-aarch64 ships
          # AAVMF (/usr/share/AAVMF/AAVMF_CODE.fd), the UEFI firmware arm64 needs.
          sudo apt-get install -y qemu-system-arm qemu-efi-aarch64 qemu-utils genisoimage
      - name: Collect ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: "*-arm64"
          merge-multiple: true
          path: out
      - name: Smoke-boot the ARM64 images (qemu TCG, real boot + health probe)
        env:
          STAGING_CP_URL: ${{ vars.STAGING_CP_URL }}
          STAGING_ENROLL_TOKEN: ${{ secrets.STAGING_ENROLL_TOKEN }}
          SMOKE_ARCH: arm64
          BOOT_TIMEOUT: "900"
        run: ci/smoke-boot.sh out

  # --- publish: APPEND ARM64 assets to the same PRIVATE release ----------------
  publish:
    # fanout is listed so its result is visible in the needs context; smoke is
    # continue-on-error (non-blocking), so publish runs whenever the build stages
    # produced artifacts and never waits on a green smoke.
    needs: [fanout, smoke]
    if: ${{ always() && needs.fanout.result == 'success' }}
    # Native arm64 runner: the "Final no-secret scan gate" step runs
    # ci/no-secret-scan.sh, which uses libguestfs guestmount. guestmount cannot
    # mount an aarch64 guest on an x86_64 host (no cross-arch KVM; TCG not wired),
    # so on ubuntu-latest the scan failed 3x -> fail-closed -> publish died. The
    # golden/fanout jobs already scan natively on ubuntu-24.04-arm, so match that
    # here to keep the fail-closed gate working.
    runs-on: ubuntu-24.04-arm
    # The final no-secret scan guestmounts each published OVA, so this job needs the
    # SAME libguestfs runner environment as golden/fanout: the direct backend plus
    # the readable-kernel / KVM / passt-AppArmor / userns workarounds the composite
    # action applies. A bare `apt-get install libguestfs-tools` is NOT enough -
    # without the workarounds the appliance's passt network fails to boot and
    # guestmount fails, tripping the fail-closed gate as UNSCANNED (SHA f4cef2d).
    env:
      LIBGUESTFS_BACKEND: direct
    steps:
      - name: Free disk space (reclaim >30GB on the runner)
        run: |
          echo "[disk] before:"; df -h /
          sudo rm -rf \
            /usr/local/lib/android \
            /usr/share/dotnet \
            /opt/ghc /usr/local/.ghcup \
            /opt/hostedtoolcache \
            /usr/local/share/boost \
            /usr/share/swift || true
          sudo docker image prune --all --force || true
          sudo apt-get clean || true
          echo "[disk] after:"; df -h /
      - uses: actions/checkout@v4
      - name: Install libguestfs toolchain (+ runner workarounds)
        # WHY: the "Final no-secret scan gate" step guestmounts every published
        # artifact. Without the composite action's readable-kernel / KVM / passt
        # workarounds (and LIBGUESTFS_BACKEND=direct above) guestmount fails on the
        # GH-hosted arm64 runner, and the fail-closed scan refuses to publish the
        # images as UNSCANNED. The golden + fanout jobs (same ubuntu-24.04-arm
        # runner) scan natively with exactly this setup; this mirrors them.
        uses: ./.github/actions/libguestfs-runner
        with:
          extra-packages: fuse3
      - name: Collect ARM64 artifacts
        uses: actions/download-artifact@v4
        with:
          # The two OVA artifacts only. The golden qcow2 is a build-only source
          # (never a deliverable), so form-*-arm64 excludes golden-qcow2-*-arm64.
          pattern: "form-*-arm64"
          merge-multiple: true
          path: dist
      - name: Flatten + reproducibility manifest
        run: |
          mkdir -p release
          # MOVE (not copy): dist/ and release/ share a filesystem so this is a
          # rename (near-zero extra space); 'cp' would double peak disk. Nothing
          # reads dist/ after this step.
          find dist -type f \( -name '*.ova' -o -name '*.sha256' \) \
            -exec mv -n {} release/ \;
          ( cd release && sha256sum ./*.ova 2>/dev/null > MANIFEST-arm64.sha256 || true )
      - name: Final no-secret scan gate (every published artifact)  # MANDATORY
        # The libguestfs toolchain + runner workarounds are installed above; this
        # step only runs the fail-closed scan over the assembled release/ set.
        run: |
          shopt -s nullglob
          for a in release/*.ova; do
            ci/no-secret-scan.sh "$a"
          done
      - name: Enforce the 2GiB Release asset cap (log + continue; does not solve R2)
        # A full-arsenal OVA can exceed 2 GiB. This moves any over-limit file out of
        # release/ with a warning so the publish never hard-fails; the full-fidelity
        # path is 'gh run download' + the operator-gated R2 mirror.
        run: ci/cap-release-assets.sh release 2147483648
      - name: Append ARM64 assets to the PRIVATE GitHub Release
        # APPEND only: tag_name + files, no name/body, so this never clobbers the
        # release notes the AMD64 publish (build.yml) wrote to the same tag. The two
        # ARM64 OVA forms (VMware OVA + VirtualBox OVA, gui) are added alongside the
        # AMD64 assets on images-v<ver>. Over-cap assets were held back by the cap
        # step; fetch those via 'gh run download' + R2.
        uses: softprops/action-gh-release@v2
        with:
          tag_name: images-v${{ env.VACTI_RELEASE }}
          prerelease: true
          files: |
            release/*.ova
            release/MANIFEST-arm64.sha256
