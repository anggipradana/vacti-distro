# vacti appliance - needrestart in NOTIFY-ONLY (list) mode.
#
# Dropped into /etc/needrestart/conf.d/. After a security library upgrade,
# needrestart must NEVER auto-restart services or force a reboot on a long-lived
# engagement box - it only LISTS what needs a restart so the operator decides.
#
# 'l' = list only (the notify-only posture). 'a' (auto) and 'i' (interactive) are
# both deliberately avoided: 'a' would bounce services mid-engagement, 'i' would
# hang the non-interactive unattended-upgrades run.
$nrconf{restart} = 'l';

# Do not emit interactive kernel-restart hints during the unattended run.
$nrconf{kernelhints} = -1;
