# /etc/sysctl.d/90-vacti.conf - vacti appliance memory tuning (shipped in the
# golden image). Reconciles with the engine's vacti.slice budget math (reserve
# 1800M, per-subagent 1000M, parent reserve 1500M) and the deliberate
# agent-scope overcommit held off the cliff at runtime by the slice brake.
#
# NON-NEGOTIABLE: vm.overcommit_memory stays 0 (heuristic). Do NOT set it to 2
# (strict) - that would break the intended agent-scope overcommit.

# Prefer reclaiming page cache over swapping anonymous pages. Low (not 0) so the
# box still uses zram/swap as a cushion under a real spike.
vm.swappiness=20

# Reclaim dentry/inode cache a bit more eagerly than the default 100 to leave
# headroom for Chromium/Node working sets on a lean appliance.
vm.vfs_cache_pressure=50

# Heuristic overcommit (kernel default). Keep 0 - the agent-scope budget is an
# intentional overcommit; strict (2) would ENOMEM legitimate large agents.
vm.overcommit_memory=0

# Chromium renderers + many-mmap tools (Go scanners, JVM) exhaust the default
# 65530 mmap limit; raise it well clear.
vm.max_map_count=1048576

# Many short-lived scanner/agent children need a large PID space.
kernel.pid_max=4194304
