# /etc/tmpfiles.d/vacti-thp.conf - set Transparent Huge Pages to `madvise` on
# every boot. THP `always` (some distro defaults) bloats the RSS of Node and
# Chromium on a memory-constrained appliance; `madvise` keeps the benefit only
# for code that opts in. Applied via systemd-tmpfiles (runs each boot) so no
# custom unit or initramfs change is needed; the write is idempotent and a
# missing sysfs path (e.g. THP compiled out) is ignored.
w /sys/kernel/mm/transparent_hugepage/enabled - - - - madvise
w /sys/kernel/mm/transparent_hugepage/defrag  - - - - madvise
