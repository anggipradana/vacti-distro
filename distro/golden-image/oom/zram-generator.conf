# /etc/systemd/zram-generator.conf - RAM-backed compressed swap, the PRIMARY
# memory cushion on a lean appliance (the shipped image has zero disk swap until
# vacti-swap-firstboot sizes one at first boot). zstd gives ~2-4x compression,
# so an 8GB box behaves like ~10-12GB effective at RAM speed.
#
# priority 100 keeps zram ABOVE the disk swapfile (pri=10) so the kernel swaps
# to RAM-compressed first and only spills to disk under sustained pressure.
#
# NOTE: vacti.slice ships MemorySwapMax=0 (from the .deb postinst) so agent
# scopes never swap; this cushion is for the OUT-of-slice daemons (Caido, Xorg,
# kernel, page cache) and banked-then-resumed recovery.
[zram0]
zram-size = min(ram / 2, 4096)
compression-algorithm = zstd
swap-priority = 100
