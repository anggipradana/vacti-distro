# ctrl-alt-del.conf -> /etc/systemd/system.conf.d/10-vacti-cad.conf
#
# L2 lockdown (B3 GREEN): Ctrl-Alt-Del must not reboot the appliance from the
# local keyboard. apply-branding.sh also masks ctrl-alt-del.target. Masking alone
# is not enough: pressing Ctrl-Alt-Del 7 times within 2 seconds still forces a
# reboot through CtrlAltDelBurstAction (default reboot-force). This setting turns
# that off.
#
# Not affected: hypervisor Reboot/Shutdown (ACPI / qemu-guest-agent), the
# operator's `sudo systemctl reboot` over SSH, and the engine.
# Takes effect at the next boot or the next `systemctl daemon-reexec`. It is
# never live-reexec'd on an engine host.
# To revert: delete this file, run `systemctl unmask ctrl-alt-del.target`, then
# reboot.
[Manager]
CtrlAltDelBurstAction=none
