# 90-vacti-sysrq.conf -> /etc/sysctl.d/90-vacti-sysrq.conf
#
# L3 lockdown (B3 GREEN): turn off the magic SysRq keyboard combinations, so
# someone at the local console cannot force a reboot, kill all tasks or remount
# disks. The 90- prefix sorts after the distro default (10-/50-*.conf), so this
# value wins.
#
# Break-glass still works: root can still write to /proc/sysrq-trigger, so the
# operator can force an emergency reboot over SSH. No engine code uses SysRq.
# To revert: delete this file, then run `sysctl kernel.sysrq=438` (or reboot).
kernel.sysrq = 0
