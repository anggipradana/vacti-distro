# Vacti OS LightDM greeter theme (GUI SKU). Installed to
# /etc/lightdm/lightdm-gtk-greeter.conf by apply-branding.sh when LightDM is
# present. Uses the brand greeter background (radar-shield lockup upper third,
# login box area left clear) and a dark GTK theme that ships with GTK, so it
# renders on any hardware without extra packages.
[greeter]
background = /usr/share/backgrounds/vacti/vacti-greeter-1920x1080.png
theme-name = Adwaita-dark
icon-theme-name = Adwaita
font-name = Sans 11
xft-antialias = true
xft-hintstyle = hintslight
xft-rgba = rgb
indicators = ~host;~spacer;~clock;~spacer;~session;~power
clock-format = %a %d %b  %H:%M
position = 50%,center 66%,center
