# Vacti OS LightDM greeter theme (GUI SKU). Installed to
# /etc/lightdm/lightdm-gtk-greeter.conf by apply-branding.sh when LightDM is
# present. Uses the brand greeter background (radar-shield lockup upper third,
# login box area left clear) and a dark GTK theme that ships with GTK, so it
# renders on any hardware without extra packages.
[greeter]
background = /usr/share/backgrounds/vacti/vacti-greeter-1920x1080.png
theme-name = Adwaita-dark
icon-theme-name = Adwaita
font-name = Sans 11
xft-antialias = true
xft-hintstyle = hintslight
xft-rgba = rgb
# L1 lockdown (B3 GREEN): no ~power indicator. Without this line, anyone at the
# login screen could reboot or power off the appliance (logind allows that to the
# active seat by default). The power options are gone from the greeter, and
# polkit/10-vacti-lockdown.rules (installed by apply-branding.sh) asks for admin
# authentication for these actions anyway, so re-adding ~power gives the greeter
# no power. The operator can still reboot via sudo over SSH, from the XFCE
# session (sudo group), or from the hypervisor.
indicators = ~host;~spacer;~clock;~spacer;~session
clock-format = %a %d %b  %H:%M
position = 50%,center 66%,center
