# 10-vacti-gate.conf -> /etc/systemd/system/lightdm.service.d/10-vacti-gate.conf
#
# THE PRE-LOGIN GATE. No desktop login is offered until the box is enrolled:
# LightDM starts ONLY once /etc/vacti-engine/engine.env exists. Until then the
# activation kiosk (vacti-activate.service) owns tty1 and runs the network->enroll
# flow; on success it writes engine.env (via the existing enroll chain) and starts
# LightDM, which now passes this condition.
#
# A drop-in ConditionPathExists= is the least-invasive, upgrade-safe way to
# withhold the display manager - it never edits the packaged lightdm.service. The
# gate is DEFENSE-IN-DEPTH + a mandatory UX front door, NOT the security boundary:
# the real moat is engine.env + the server-side token kill-switch (every engine
# unit is EnvironmentFile=/etc/vacti-engine/engine.env, and the tokens are
# revocable at the control plane). A bypassed local gate yields a bare desktop
# with no working engine, no skills, no tokens.
#
# Installed by branding/apply-branding.sh only when LightDM is present (GUI SKU);
# harmless/absent on the headless SKU.
[Unit]
ConditionPathExists=/etc/vacti-engine/engine.env
After=vacti-activate.service
