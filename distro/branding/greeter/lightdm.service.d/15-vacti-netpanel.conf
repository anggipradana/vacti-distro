# 15-vacti-netpanel.conf -> /etc/systemd/system/lightdm.service.d/15-vacti-netpanel.conf
#
# POST-ENROLL network-panel DEFER. This is ADDITIVE to the engine.env gate
# (10-vacti-gate.conf) - it is a SEPARATE drop-in and does NOT touch or weaken that
# condition. After the box is enrolled, vacti-netpanel.service owns tty1 first and
# presents a NetworkManager settings console; while it holds the runtime flag
# /run/vacti-netpanel.active, LightDM defers. When the operator chooses the desktop
# login, vacti-netpanel removes the flag and starts lightdm.service, which now passes
# this condition. The flag is on tmpfs (cleared each boot) and is also removed by the
# unit's ExecStopPost, so a panel crash can never leave the desktop login permanently
# withheld (vacti-netpanel.service also has OnFailure=lightdm.service).
#
# NET EFFECT on the lightdm gate: LightDM now starts iff engine.env exists (the
# unchanged 10-vacti-gate.conf) AND the post-enroll panel is not currently holding
# tty1 (this file). The "withheld until enrolled" guarantee is preserved verbatim.
#
# Installed by branding/apply-branding.sh only when LightDM is present (GUI SKU);
# absent/harmless on the headless SKU.
[Unit]
ConditionPathExists=!/run/vacti-netpanel.active
After=vacti-netpanel.service
