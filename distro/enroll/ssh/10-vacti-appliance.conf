# /etc/ssh/sshd_config.d/10-vacti-appliance.conf - appliance SSH login policy.
#
# Two field bugs this fixes on the OVA (vbox + vmware), both observed on an enrolled
# appliance where `ssh arparp@<tailnet-ip>` failed with "Permission denied (publickey)":
#
# 1. The Debian 13 cloud base image hard-codes `PasswordAuthentication no` in the main
#    /etc/ssh/sshd_config, so the documented default `arparp` login worked on the
#    console / LightDM but NEVER over SSH. sshd uses the FIRST value it reads and the
#    main config includes sshd_config.d/*.conf at its top, so this drop-in wins.
#    The retrofit fleet's key-only 05-vacti-hardening.conf sorts earlier and still wins
#    there (that host class is unchanged).
#
# 2. The engine converges the control-plane operator keys (Settings > Engine SSH keys)
#    into the ENGINE PROCESS user's ~/.ssh/authorized_keys. On the appliance that is the
#    `vacti-engine` system user (nologin shell), not the `arparp` login account, so the
#    CP key never reached the account an operator logs in as. The Match block below lets
#    `arparp` also accept exactly that engine-managed key block, read by a root-owned
#    helper that runs as the engine user (least privilege; it only reads its own file).
#    Keys in arparp's own ~/.ssh/authorized_keys keep working as usual.
PasswordAuthentication yes
KbdInteractiveAuthentication no

Match User arparp
	AuthorizedKeysCommand /usr/local/libexec/vacti-operator-keys %u
	AuthorizedKeysCommandUser vacti-engine
