# 10-vacti-no-autovt.conf -> /etc/systemd/logind.conf.d/10-vacti-no-autovt.conf
#
# TG 7212 defense-in-depth: never auto-spawn a getty when a virtual terminal is
# activated. The activation wizard owns tty1 directly (TTYPath), and the display
# manager (post-enrollment) allocates its own VT via logind regardless of this
# setting, so no legitimate path needs auto-spawned VT gettys. Removing them means
# Ctrl+Alt+F2..F6 cannot conjure a login shell even if a getty were briefly
# unmasked. Baked by branding/apply-branding.sh on every SKU.
[Login]
NAutoVTs=0
ReserveVT=0
