# vacti arsenal manifest (documentation of record)
#
# The MACHINE-CONSUMED sources are the plain package lists in this directory:
#   web-lean.list  - baked default (ENGINE_CAPABILITIES=web,infra)
#   full.list      - the per-vertical apt sets added on top (VACTI_FULL_ARSENAL=1)
# This YAML documents where each set comes from and keeps the mapping explicit.
# It is NOT hand-maintained independently: regenerate the .list files from the
# engine's packaging/bootstrap-apt.sh (APT_PACKAGES + APT_PKGS_* per-vertical
# arrays), cross-checked against src/runner/arsenal-check.ts (TOOL_APT_PACKAGES),
# so the image arsenal always matches what the runtime asserts and self-heals.

source_of_truth:
  engine_repo: vacti-pentest-engine
  apt_set: packaging/bootstrap-apt.sh # APT_PACKAGES (+ APT_PKGS_SOURCE/MOBILE/IOS/RE)
  arsenal_check: src/runner/arsenal-check.ts # TOOL_APT_PACKAGES binary->package map

# Baked on every image (web-lean.list).
core:
  scanners_recon:
    [nmap, nuclei, httpx-toolkit, naabu, subfinder, ffuf, gobuster, dirsearch,
     sqlmap, weevely, whatweb, commix, dnsx, katana, trufflehog, feroxbuster]
  wordlists: [seclists, dirb]
  base_runtime:
    [default-mysql-client, nftables, jq, curl, wget, git, build-essential,
     ca-certificates, xvfb, fonts-noto, fonts-noto-cjk, fonts-noto-color-emoji,
     pipx, golang-go, ripgrep, fd-find, openssh-server, adb, xz-utils, socat,
     netcat-openbsd, default-jre-headless, unzip, binutils, python3-venv,
     python3-full]
  tls_network: [sslscan, testssl.sh]
  vpn_clients:
    [openconnect, openfortivpn, openvpn,
     wireguard-tools, strongswan, strongswan-swanctl]
  evidence_screenshot:
    [imagemagick, xdotool, x11-xserver-utils, qterminal, sshpass, tmux]
  # Anti-OOM backstops; config drop-ins staged by golden-image/oom/.
  anti_oom: [systemd-zram-generator, earlyoom]
  # chromium: bundled in vacti-engine .deb via playwright-core build 1228; no separate apt pkg.
  # Its shared-library deps are made explicit (trixie t64 names where renamed)
  # so headless launch does not fail on the thin genericcloud base.
  chromium_deps:
    [libnss3, libgbm1, libasound2t64, libatk1.0-0t64, libatk-bridge2.0-0t64,
     libcups2t64, libdrm2, libxkbcommon0, libxcomposite1, libxdamage1,
     libxrandr2, libxfixes3, libpango-1.0-0, libcairo2]

# Added only with VACTI_FULL_ARSENAL=1 (full.list). Otherwise fetched post-boot
# by the runtime arsenal-check when ENGINE_CAPABILITIES advertises the vertical.
verticals:
  source: [trivy]
  mobile: [scrcpy, apktool, aapt]
  ios: [usbmuxd, libimobiledevice-utils, libplist-utils, llvm]
  re: [gdb-multiarch, binwalk, strace, ltrace, tshark, checksec]

# NON-apt heavy tools: never baked; runtime self-heal fetches per capability.
# NOTE: ghidra MOVED OUT of this list - it is now baked MANDATORY (see
# native_re_engine below), because REA's native decompilation depends on it.
non_apt_post_boot:
  [jadx, frida-tools, objection, pymobiledevice3, semgrep,
   re-python-venv, impacket, netexec, bloodhound-python, awscli, kubectl, caido]

# MANDATORY non-apt tool, BAKED on every image + every SKU (not post-boot, not
# opt-in). npm-installed, PINNED per the 2026-10-13 REA safety vetting. Baked by
# golden-image/install-rea.sh (golden/cloud/OVA path) and the live-build hook
# config/hooks/normal/0300-rea.hook.chroot (ISO path); both ensure Node meets
# REA's engine floor first. Keep the pin in sync with vacti-appliance.env
# (VACTI_REA_VERSION).
#
# DISTRO vs MINTING boundary: the distro bakes only the RUNTIME (a Node >= floor
# plus the global rea-agents package) so the engine's agent can launch the local
# `rea` MCP (`npx -y rea-agents@<ver> mcp` / the global `rea` bin) deterministically
# and offline. The MCP-server REGISTRATION and the reverse-engineer-anything skill
# are the engine/minting side's responsibility (packaging/bootstrap-apt.sh + the
# engine .deb's baked mcp config + off-box skill delivery); they are NOT written
# to disk here, because the image ships ZERO .claude methodology on disk
# (ci/no-secret-scan.sh fails the build otherwise).
reverse_engineering_mcp:
  tool: rea-agents
  version: "6.4.0"                                  # PINNED; vetted SAFE 2026-10-13
  install: "npm install -g --ignore-scripts rea-agents@6.4.0"
  node_floor: "^22.19.0 || ^24.11.0 || >=26.0.0"    # NodeSource setup_22.x satisfies
  baked_by:
    golden: golden-image/install-rea.sh
    iso: live-build-config/config/hooks/normal/0300-rea.hook.chroot
  mcp_and_skill_owner: "engine-repo (bootstrap-apt.sh + .deb mcp config); never .claude on disk"

# MANDATORY native RE engine (REA's native binary-decompile dependency), BAKED on
# every image + every SKU. Pinned to MIRROR the engine's packaging/bootstrap-apt.sh
# step_ghidra (which GATES it behind caps re/desktop/firmware; the distro bakes it
# unconditionally per the operator). Pure-Java -> needs a JDK 17+; trixie
# default-jre-headless (JDK 21, already in core.base_runtime) satisfies it. The
# installers set GHIDRA_INSTALL_DIR + JAVA_HOME in the image so REA finds it.
# Baked by golden-image/install-ghidra.sh + the ISO hook 0310-ghidra.hook.chroot.
# ci/no-secret-scan.sh --exclude-dir=ghidra keeps Ghidra's sample keys/passwords
# (tool DATA under /opt/ghidra) from tripping the secret gate (testssl precedent).
native_re_engine:
  tool: ghidra
  version: "11.1.2"                                 # PINNED; mirror engine GHIDRA_VERSION
  release_tag: "Ghidra_11.1.2_build"
  asset: "ghidra_11.1.2_PUBLIC_20240709.zip"
  source: "github.com/NationalSecurityAgency/ghidra (pinned release zip -> /opt/ghidra)"
  jdk: "openjdk-21-jre-headless (JDK 17+ required; trixie default-jre-headless = 21)"
  env_baked: [GHIDRA_INSTALL_DIR, JAVA_HOME]        # /etc/environment + /etc/profile.d/vacti-ghidra.sh
  size_note: "~1GB unpacked under /opt/ghidra (deliberate: native RE on every appliance)"
  baked_by:
    golden: golden-image/install-ghidra.sh
    iso: live-build-config/config/hooks/normal/0310-ghidra.hook.chroot

# Added only with VACTI_CTF_ARSENAL=1 (ctf.list + golden-image/install-ctf-arsenal.sh).
# Default OFF - kind=ctf engagements otherwise self-heal post-boot. Lean by design:
# sagemath / ghidra / stegsolve are DELIBERATELY excluded (multi-GB / GUI).
ctf:
  apt:                 # packages/ctf.list (Debian main; radare2+exploitdb via Kali pin)
    forensics:   [foremost, scalpel, sleuthkit, binwalk]
    steg:        [steghide, libimage-exiftool-perl]
    crypto:      [python3-pycryptodome]
    pwn:         [python3-pwntools, python3-ropgadget, gdb, nasm]
    reverse:     [radare2, ltrace, strace]    # radare2 from Kali pin (absent from trixie main)
    cracking:    [john, hashcat]
    net:         [netcat-openbsd]
    exploitdb:   [exploitdb]                   # from Kali pin; git-clone fallback in installer
    toolchain:   [ruby, ruby-dev, python3-pip]
  non_apt:             # installed by install-ctf-arsenal.sh (best-effort)
    ruby_gems:   [zsteg, one_gadget]
    pipx:        [volatility3, RsaCtfTool]     # RsaCtfTool from upstream git
    gdb_plugin:  [gef]                         # single-file; pwndbg deliberately skipped (heavy)
    git_fallback: [exploitdb]                  # when apt (Kali) cannot supply searchsploit
  # ghidra was excluded here as too-heavy for the CTF arsenal, but it is now baked
  # GLOBALLY + MANDATORY (see native_re_engine) as REA's decompile engine, so the
  # CTF path inherits it. sagemath/stegsolve/pwndbg stay excluded.
  excluded_too_heavy: [sagemath, stegsolve, pwndbg-full-setup]

# The ~6 CORE tools absent from Debian main; how they resolve.
debian_main_gaps:
  tools: [nuclei, httpx-toolkit, naabu, feroxbuster, seclists, commix]
  option_a: Kali apt source, pinned prio 100 (see kali-repo/) # default
  option_b: go-install / git / GitHub release (VACTI_NO_KALI_REPO=1)
