# vacti arsenal manifest (documentation of record / pointer)
#
# The ENGINE ARSENAL is no longer hand-transcribed into distro package lists. The
# single machine-readable source of truth is the engine's generated manifest:
#   engine repo: vacti-pentest-engine
#   source:      packaging/arsenal.env        (the one declarative tool module)
#   generated:   packaging/arsenal-manifest.json
#   shipped:     inside the vacti-engine .deb at
#                /usr/lib/vacti-engine/packaging/arsenal-manifest.json
#
# HOW THE DISTRO CONSUMES IT
#   - gen-live-build-list.sh DERIVES every image's engine-arsenal apt set from the
#     manifest (lean = apt.core minus the per-vertical sets; full = apt.core;
#     +apt.ctf when VACTI_CTF_ARSENAL=1). In-guest builds read the manifest from
#     the INSTALLED .deb; host-side / ISO / offline builds read the vendored
#     snapshot arsenal-manifest.json beside the generator.
#   - distro-owned.list holds the NON-arsenal base packages the distro owns
#     (Chromium shared-lib closure, anti-OOM backstops, the fastfetch banner, a
#     couple of TLS inspectors, base runtime). The GUI desktop set (XFCE,
#     Calamares, Plymouth, LightDM, whisker menu) lives in the ISO's
#     ../live-build-config/config/package-lists/vacti-gui.list.chroot.in.
#   - ci/arsenal-sync-check.sh FAILS the build if the vendored snapshot or the
#     generator diverges from the engine manifest at the pinned VACTI_ENGINE_REF.
#     This is the enforcement the old prose ("do not hand-maintain a divergent
#     list") never had.
#
# NOT in the manifest (so still distro-owned pins): the heavy non-apt mandatory
# tools - REA (rea-agents), Ghidra + Temurin JDK, interactsh-client, gau, Caido -
# are version-pinned in vacti-appliance.env + the ISO hooks (install METHOD is the
# distro's own concern). A future engine manifest revision can absorb those pins;
# until then they are intentionally out of the sync set.

source_of_truth:
  engine_repo: vacti-pentest-engine
  arsenal_env: packaging/arsenal.env
  manifest: packaging/arsenal-manifest.json
  shipped_in_deb: /usr/lib/vacti-engine/packaging/arsenal-manifest.json
  vendored_snapshot: distro/packages/arsenal-manifest.json

derivation:
  generator: distro/packages/gen-live-build-list.sh
  lean: apt.core minus union(apt.verticals.*) # baked default (ENGINE_CAPABILITIES=web,infra)
  full: apt.core                              # VACTI_FULL_ARSENAL=1
  ctf: apt.ctf                                # VACTI_CTF_ARSENAL=1 (also install-ctf-arsenal.sh apt half)
  distro_owned: distro/packages/distro-owned.list # non-arsenal base (NOT from the manifest)

enforcement:
  guard: ci/arsenal-sync-check.sh             # fails on snapshot/generator drift vs the engine manifest
  pinned_ref: VACTI_ENGINE_REF                # vacti-appliance.env; empty = floating latest

debian_main_gaps:
  tools: [nuclei, httpx-toolkit, naabu, feroxbuster, seclists, commix]
  option_a: Kali apt source, pinned prio 100 (see kali-repo/) # default
  option_b: go-install / git / GitHub release (VACTI_NO_KALI_REPO=1)
