# Calamares settings for the GUI SKU install-to-disk. Lands at /etc/calamares/
# via includes.chroot (build-iso.sh copies this tree when SKU=gui). This is a
# standard Debian-live module sequence with vacti branding.
---
modules-search: [ local, /usr/lib/x86_64-linux-gnu/calamares/modules ]
sequence:
  - show:
      - welcome
      - locale
      - keyboard
      - partition
      - users
      - summary
  - exec:
      - partition
      - mount
      - unpackfs
      - machineid
      - fstab
      - locale
      - keyboard
      - users
      - networkcfg
      - grubcfg
      - bootloader
      - umount
  - show:
      - finished
branding: vacti
prompt-install: true
dont-chroot: false
