# debian-installer preseed for the HEADLESS SKU (unattended rack install).
# Partitioning + locale + the vacti user; late_command drops the first-run
# enroll service so the installed system enrolls on first boot. NO enroll/engine
# token is preseeded here - the operator supplies a live token at first boot.
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i time/zone string UTC
d-i clock-setup/utc boolean true

# Networking: DHCP, hostname set at enroll time
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string vacti-engine
d-i netcfg/get_domain string local

# Mirror (trixie); the vacti + Kali sources are already in the live system image
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/suite string trixie

# Guided full-disk, single ext4 + swap, native UEFI (Calamares path for GUI)
d-i partman-auto/method string regular
d-i partman-auto/choose_recipe select atomic
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/choose_partition select finish
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

# A non-root sudo user with the standard default credential vacti:vacti (the
# Kali `kali:kali` convention). Root login stays disabled; this user is the
# sudo-capable shell/SSH login. The password is the documented default - users
# are expected to change it after first boot if they want stronger credentials.
d-i passwd/root-login boolean false
d-i passwd/make-user boolean true
d-i passwd/user-fullname string Vacti operator
d-i passwd/username string vacti
# SHA-512-crypt ($6$) hash of the password "vacti" (openssl passwd -6 vacti).
# Preseeding the hash skips the interactive password prompt during the unattended
# install so the installed system comes up with the documented default login.
d-i passwd/user-password-crypted password $6$vactivacti00$3igqTYrSaFTAz4CYRta4YuSprc.8FWy08mGJBCSzlkxmjTtghltuf5q9C3/yUCu6h/saMOqyp8ZM31DPFmewM.
# Deliberately accept the weak default (the installer otherwise rejects it) and
# keep /home unencrypted (headless rack install, no interactive passphrase).
d-i user-setup/allow-password-weak boolean true
d-i user-setup/encrypt-home boolean false

d-i pkgsel/upgrade select safe-upgrade
tasksel tasksel/first multiselect standard

# GRUB to the ESP (UEFI) / MBR (BIOS)
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string default

# Hand off: enable the first-run enroll unit on the installed system.
d-i preseed/late_command string \
  in-target systemctl enable vacti-firstrun.service || true

d-i finish-install/reboot_in_progress note
